<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Balancier.">
<meta name="theme-color" content="#FFFFFF" id="meta-theme">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<title>Balancier.</title>
<style>
/* Layout: iOS app shell. Large title + animated balance wheel on top, one view per tab (Aujourd'hui, Suivi, Absences, Réglages), translucent tab bar at the bottom. Black on white with grey groups; dark mode mirrors it. */
:root{
  --bg:#FFFFFF; --fg:#000000;
  --raised:#F2F2F7; --hair:#E5E5EA; --muted:#8E8E93; --faint:#C7C7CC;
  --accent:#000000; --on-accent:#FFFFFF;
  --ok:#248A3D; --neg:#D70015; --warn:#B25000;
  --scrim:rgba(0,0,0,.28); --bar-bg:rgba(249,249,249,.88);
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --tabh:52px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#000000; --fg:#FFFFFF;
  --raised:#1C1C1E; --hair:#38383A; --muted:#8E8E93; --faint:#48484A;
  --accent:#FFFFFF; --on-accent:#000000;
  --ok:#30D158; --neg:#FF453A; --warn:#FF9F0A;
  --scrim:rgba(0,0,0,.6); --bar-bg:rgba(22,22,24,.88);
  color-scheme:dark;
}
html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{height:100%;background:var(--bg);color:var(--fg);overscroll-behavior:none}
body{margin:0;font-family:var(--f-body);font-size:17px;line-height:1.35;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--ok)} .neg{color:var(--neg)}

.app{max-width:440px;min-height:100%;margin:0 auto;padding-top:14px;padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-direction:column}
.view{display:flex;flex-direction:column;flex:1}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.titles{display:flex;flex-direction:column;gap:2px;min-width:0}
.date{color:var(--muted);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.logo{font-family:var(--f-display);font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.logo span{color:var(--muted)}

/* balance wheel */
.wheel{width:46px;height:46px;flex:none;margin-bottom:4px}
.wheel .rim{fill:none;stroke:var(--fg);stroke-width:5}
.wheel .arm{stroke:var(--muted);stroke-width:2.5}
.wheel .spring{fill:none;stroke:var(--fg);stroke-width:2;stroke-linecap:round}
.wheel .hub{fill:var(--fg)}
.wheel g.rot{transform-origin:50px 50px}
.wheel.on g.rot{animation:swing 1.6s cubic-bezier(.45,0,.55,1) infinite alternate}
.wheel.on .spring{animation:breathe 1.6s cubic-bezier(.45,0,.55,1) infinite alternate;transform-origin:50px 50px}
@keyframes swing{from{transform:rotate(-135deg)}to{transform:rotate(135deg)}}
@keyframes breathe{from{transform:rotate(-20deg) scale(.94)}to{transform:rotate(20deg) scale(1.04)}}

.hero{margin-top:24px;display:flex;flex-direction:column}
.kicker{color:var(--muted);font-size:15px;font-weight:500}
.time{font-family:var(--f-display);font-size:clamp(64px,19vw,80px);font-weight:600;line-height:1;letter-spacing:-.035em;margin-top:2px}
.time.word{font-size:clamp(44px,13vw,56px);letter-spacing:-.025em;padding-block:10px 6px}
.time.pos{color:var(--ok)} .time.neg{color:var(--neg)}
.bar{height:6px;background:var(--raised);border-radius:3px;overflow:hidden;margin-top:16px}
.card .bar{background:var(--hair)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;width:0;transition:width .6s ease}
.meta{display:flex;justify-content:space-between;gap:12px;margin-top:8px;font-size:15px;color:var(--muted)}
.meta b{color:var(--fg);font-weight:600}
.nudge{margin-top:12px;align-self:flex-start;background:var(--raised);border-radius:10px;padding:7px 12px;font-size:14px;font-weight:500}
.nudge.warn{color:var(--warn)}

.card{margin-top:16px;background:var(--raised);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.proj{margin-top:22px}
.proj-main{display:flex;justify-content:space-between;align-items:center;gap:12px}
.proj-main span{color:var(--muted);font-size:15px;font-weight:500;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.proj-main input{background:var(--bg);border:0;border-radius:8px;padding:4px 8px;color:var(--fg);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.proj-main input:focus{outline:2px solid var(--accent)}
.proj-main b{font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:-.02em}
.rows{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--hair);padding-top:10px}
.rowx{display:flex;justify-content:space-between;gap:10px;font-size:15px;color:var(--muted)}
.rowx b{font-weight:600}
.warnline{font-size:13px;color:var(--neg);margin:-4px 0 0}
.card-title{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.02em}

.today{margin-top:24px;display:flex;flex-direction:column;gap:10px}
.today-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.today-head span{font-size:20px;font-weight:700;letter-spacing:-.02em}
.today-head span small{font-size:13px;font-weight:600;color:var(--muted);margin-left:8px;letter-spacing:0}
.today-head button{border:0;background:none;color:var(--muted);font-size:15px;font-weight:500;padding:4px 0}
.punches{display:flex;flex-wrap:wrap;gap:8px}
.p{background:var(--raised);border:0;border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;align-items:flex-start;min-width:78px;text-align:left}
.p small{font-size:12px;color:var(--muted);font-weight:500}
.p b{font-size:19px;font-weight:600}
.p.in small::before,.p.out small::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:1px}
.p.in small::before{background:var(--fg)} .p.out small::before{border:1.5px solid var(--muted);width:4px;height:4px}
.p.empty{color:var(--muted);font-size:15px;background:none;padding:6px 0}

.bottom{margin-top:auto;padding-top:28px;display:flex;flex-direction:column;gap:12px}
.live{text-align:center;color:var(--muted);font-size:13px;font-weight:500}
.live b{color:var(--fg);font-weight:600}
.punch{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pb{border:0;border-radius:16px;height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:var(--raised);color:var(--faint);transition:transform .08s,opacity .15s}
.pb span{font-weight:600;font-size:19px}
.pb small{font-size:13px;font-weight:500;opacity:.75}
.pb.on{background:var(--accent);color:var(--on-accent)}
.pb:not(.on){cursor:default}
.pb.on:active{transform:scale(.97);opacity:.85}
.pb.pop{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.04)}}
.week{display:flex;justify-content:center;gap:18px;font-size:14px;color:var(--muted);min-height:18px}
.week b{font-weight:600}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--bar-bg);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--hair);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar-in{max-width:480px;margin:0 auto;height:var(--tabh);display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:10.5px;font-weight:500;letter-spacing:0}
.tab svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--fg)}
.tab.on svg{stroke-width:2.2}

/* shared page blocks */
.page{display:flex;flex-direction:column;gap:16px;margin-top:18px}
.page h4,.sheet h4{margin:6px 16px -8px;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.02em}
.list{display:flex;flex-direction:column;border-radius:12px;overflow:hidden;background:var(--raised)}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border:0;background:none;text-align:left;width:100%;min-height:48px}
.item + .item{border-top:.5px solid var(--hair)}
.item small{display:block;color:var(--muted);font-size:13px;margin-top:1px}
.item input,.item select{background:none;border:0;text-align:right;color:var(--muted);font-size:17px;min-width:0;width:auto;max-width:170px}
.item input[type="text"]{width:100%}
.item input:focus,.item select:focus{outline:none;color:var(--fg)}
.item .r{font-weight:600;white-space:nowrap}
.item .grow{flex:1}
.item .tag{font-size:12px;font-weight:600;color:var(--muted);background:var(--hair);border-radius:6px;padding:2px 6px;margin-left:6px}
.item.future{color:var(--faint)}
.item.off{color:var(--muted)}
.note{color:var(--muted);font-size:13px;margin:-8px 16px 0}
.err{color:var(--neg);font-size:14px;margin:0 4px}
.row{display:flex;gap:10px}
.row .ghost,.row .cta{flex:1}
.cta{border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:17px;height:50px;width:100%}
.ghost{border:0;border-radius:14px;background:var(--raised);color:var(--fg);font-weight:600;font-size:17px;height:50px;display:flex;align-items:center;justify-content:center;cursor:pointer;width:100%}
.addp{border:0;background:none;color:var(--fg);font-weight:600;font-size:16px;text-align:left;padding:2px 16px}
.danger{border:0;background:none;color:var(--neg);font-weight:500;font-size:16px;height:44px}
.toggle{accent-color:var(--accent);width:20px;height:20px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--hair);border-radius:9px;padding:2px}
.seg button{border:0;background:none;color:var(--fg);font-weight:500;font-size:14px;height:30px;border-radius:7px;padding:0 4px}
.seg button.on{background:var(--bg);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
:root[data-theme="dark"] .seg button.on{background:#636366}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px}
.chip{border:0;background:var(--hair);color:var(--fg);border-radius:16px;padding:7px 13px;font-size:15px;font-weight:500}
.chip.on{background:var(--accent);color:var(--on-accent)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav button{border:0;background:none;color:var(--fg);font-size:26px;width:40px;height:40px;border-radius:20px;line-height:1}
.nav button[disabled]{color:var(--faint);cursor:default}
.nav div{text-align:center;font-weight:700;font-size:18px}
.nav small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 4px}
.sum div{display:flex;flex-direction:column;gap:2px;color:var(--muted);font-size:13px;min-width:0}
.sum b{color:var(--fg);font-size:22px;font-weight:700;letter-spacing:-.02em}
.sum.small b{font-size:18px}
.mini{display:block;height:3px;background:var(--hair);border-radius:2px;margin-top:7px;width:120px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--fg)}
.mini i.full{background:var(--ok)}

/* chart */
.chart{background:var(--raised);border-radius:16px;padding:14px 12px 8px;display:flex;flex-direction:column;gap:6px}
.readout{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:0 4px;min-height:44px}
.readout .l{color:var(--muted);font-size:13px;font-weight:500}
.readout .l b{display:block;color:var(--fg);font-size:15px;font-weight:600}
.readout .v{font-family:var(--f-display);font-size:28px;font-weight:700;letter-spacing:-.02em}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.chart .grid{stroke:var(--hair);stroke-width:1}
.chart .zero{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.chart .ylab,.chart .xlab{font-size:10px;fill:var(--muted);font-family:var(--f-body)}
.chart .area{fill:var(--fg);opacity:.07}
.chart .line{fill:none;stroke:var(--fg);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--fg);stroke:var(--raised);stroke-width:2}
.chart .pt.sel{r:6}
.chart .cross{stroke:var(--muted);stroke-width:1}
.chart .empty{font-size:13px;fill:var(--muted);font-family:var(--f-body)}

/* absences */
.big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.big b{font-family:var(--f-display);font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1}
.big span{color:var(--muted);font-size:15px;font-weight:500}

/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:500px;max-height:90%;overflow:auto;border-radius:14px 14px 0 0;
  padding:8px max(16px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
:root[data-theme="dark"] .sheet{background:#0F0F10}
.sheet > *{flex-shrink:0}
.grab{width:36px;height:5px;border-radius:3px;background:var(--faint);align-self:center}
.sheet h3{margin:4px 4px 0;font-size:22px;font-weight:700;letter-spacing:-.02em}
.x{border:0;background:var(--hair);color:var(--muted);width:28px;height:28px;border-radius:14px;font-size:16px;line-height:1;flex:none}
.tones{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 16px}
.tone{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:0}
.tone i{display:block;width:44px;height:44px;border-radius:22px;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(128,128,128,.25)}
.tone.on{color:var(--fg);font-weight:600}
.tone.on i{border-color:var(--fg)}
.transit{display:flex;flex-direction:column;gap:8px}
.tr-main{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.tr-main b{display:block;font-family:var(--f-display);font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.05}
.tr-r{text-align:right}
.tr-k{font-size:13px;color:var(--muted);font-weight:500}
.tr-lines{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chipline{background:var(--fg);color:var(--bg);font-size:13px;font-weight:600;border-radius:6px;padding:3px 8px}
.sep{color:var(--muted)}
.late{color:var(--warn);font-weight:600;font-size:14px}
.tr-sub{font-size:14px;color:var(--muted)}
.tr-tip{font-size:14px;color:var(--muted)}
.tr-tip b{color:var(--fg)}
.tr-more{border:0;background:none;color:var(--fg);font-weight:600;font-size:15px;padding:4px 0 0;text-align:left}
.item.leg{padding-block:10px;min-height:0}
.dep{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.dep b{font-weight:600}
.dep span{color:var(--muted)}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);font-size:14px;font-weight:500;padding:6px 6px 6px 16px;min-height:40px;border-radius:20px;z-index:30;white-space:nowrap;display:flex;align-items:center;gap:12px;box-shadow:0 8px 28px rgba(0,0,0,.18)}
.toast button{border:0;background:rgba(128,128,128,.28);color:var(--bg);font-weight:600;font-size:14px;border-radius:14px;padding:6px 12px}
.toast:not(.undo){padding-right:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="titles">
      <div class="date" id="date"></div>
      <div class="logo" id="title">Balancier<span>.</span></div>
    </div>
    <svg class="wheel" id="wheel" viewBox="0 0 100 100" aria-hidden="true">
      <g class="rot">
        <circle class="rim" cx="50" cy="50" r="44"/>
        <line class="arm" x1="50" y1="50" x2="50" y2="8"/>
        <line class="arm" x1="50" y1="50" x2="86.4" y2="71"/>
        <line class="arm" x1="50" y1="50" x2="13.6" y2="71"/>
      </g>
      <path class="spring" d="M50 50 m0 -4 a4 4 0 1 1 -0.1 0 M50 50 m0 -9 a9 9 0 1 1 -0.1 0 M50 50 m0 -15 a15 15 0 1 1 -0.1 0 M50 50 m0 -21 a21 21 0 1 1 -12 3.5" />
      <circle class="hub" cx="50" cy="50" r="5"/>
    </svg>
  </header>

  <!-- Aujourd'hui -->
  <main class="view" id="v-today">
    <section class="hero" aria-live="polite">
      <div class="kicker" id="kicker">Départ</div>
      <div class="time num" id="time">--:--</div>
      <div class="bar" aria-hidden="true"><i id="fill"></i></div>
      <div class="meta"><span id="meta-l"></span><span id="meta-r"></span></div>
      <div class="nudge" id="nudge" hidden></div>
    </section>

    <section class="card proj" id="proj" hidden aria-live="polite">
      <div class="proj-main"><span><span id="proj-txt">À ta sortie,</span> <input type="time" id="proj-out" aria-label="Heure de sortie prévue"></span><b class="num" id="proj-bal"></b></div>
      <p class="warnline" id="proj-warn" hidden></p>
      <div class="rows">
        <div class="rowx"><span>Semaine</span><span class="num" id="proj-wk"></span></div>
        <div class="rowx"><span>Compteur</span><span class="num" id="proj-tot"></span></div>
      </div>
    </section>

    <section class="card" id="transit" hidden>
      <div class="card-title" id="transit-title">Retour</div>
      <div class="transit" id="transit-list"></div>
    </section>

    <section class="today">
      <div class="today-head"><span>Pointages<small id="day-tag"></small></span><button id="btn-edit">Modifier</button></div>
      <div class="punches" id="punches"></div>
    </section>

    <section class="bottom">
      <div class="live">Heure de l'iPhone <b class="num" id="clock">--:--:--</b></div>
      <div class="punch">
        <button class="pb" id="btn-in"><span>Entrée</span><small class="num" id="in-t"></small></button>
        <button class="pb" id="btn-out"><span>Sortie</span><small class="num" id="out-t"></small></button>
      </div>
      <div class="week" id="week"></div>
    </section>
  </main>

  <main class="view" id="v-track" hidden></main>
  <main class="view" id="v-abs" hidden></main>
  <main class="view" id="v-set" hidden></main>
</div>

<nav class="tabbar" aria-label="Navigation">
  <div class="tabbar-in">
    <button class="tab on" data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Aujourd'hui</button>
    <button class="tab" data-tab="track"><svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 3 8-8"/><path d="M3 21h18"/></svg>Suivi</button>
    <button class="tab" data-tab="abs"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Absences</button>
    <button class="tab" data-tab="set"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Réglages</button>
  </div>
</nav>

<div class="scrim" id="scrim" hidden></div>
<div class="toast" id="toast" hidden><span id="toast-msg"></span><button id="toast-undo" hidden>Annuler</button></div>

<script>
(() => {
  const LS_KEY = "pointage.v1";
  const clone = o => JSON.parse(JSON.stringify(o));
  const DEFAULT_SETTINGS = {
    sched: [0, 504, 504, 504, 504, 504, 0],   // index = getDay() (0 = dimanche)
    pauseMin: 30, winStart: 390, clampStart: false, minOut: 945,
    tone: "ios", theme: "auto", holidays: "GE",
    vacDays: 25, maxWeek: 2700, remoteCap: 0,
    transit: { home: "", work: "", margin: 5 }
  };
  let state = { settings: clone(DEFAULT_SETTINGS), days: {} };

  // ---------- helpers ----------
  const pad = n => String(n).padStart(2, "0");
  const toMin = s => { if (!s) return null; const [h, m] = s.split(":").map(Number); return h * 60 + m; };
  const clock = m => { m = ((Math.round(m) % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ":" + pad(m % 60); };
  const hm = m => { m = Math.max(0, Math.round(m)); return Math.floor(m / 60) + "h" + pad(m % 60); };
  const signed = m => { m = Math.round(m); return (m < 0 ? "−" : "+") + hm(Math.abs(m)); };
  const dateKey = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
  const parseKey = k => { const [y, mo, d] = k.split("-").map(Number); return new Date(y, mo - 1, d); };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const J = ["dim.", "lun.", "mar.", "mer.", "jeu.", "ven.", "sam."];
  const JL = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
  const M = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
  const MOIS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
  const longDate = d => J[d.getDay()] + " " + d.getDate() + " " + M[d.getMonth()];
  const short = d => d.getDate() + " " + M[d.getMonth()];
  const mondayOf = d => { const x = new Date(d); x.setDate(x.getDate() - (x.getDay() + 6) % 7); x.setHours(0, 0, 0, 0); return x; };
  const isoWeek = d => { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day); const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y0) / 864e5 + 1) / 7); };
  const sortTimes = a => a.filter(Boolean).sort((x, y) => toMin(x) - toMin(y));
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmtDays = n => String(Math.round(n * 2) / 2).replace(".", ",");

  const TYPES = { work: "Travail", conge: "Congé", maladie: "Maladie", recup: "Récupération", ferie: "Férié" };
  const norm = v => ({
    punches: sortTimes(Array.isArray(v && v.punches) ? v.punches : [v && v.in, v && v.bs, v && v.be, v && v.out]),
    type: (v && TYPES[v.type]) ? v.type : "work",
    half: !!(v && v.half), remote: !!(v && v.remote)
  });
  const meaningful = r => r.punches.length || r.type !== "work" || r.remote;

  function migrateSettings(s) {
    const out = { ...clone(DEFAULT_SETTINGS), ...(s || {}) };
    if (!Array.isArray(out.sched) || out.sched.length !== 7) { const d = (s && s.daily) || 504; out.sched = [0, d, d, d, d, d, 0]; }
    const ot = (s && s.transit) || {};
    out.transit = { home: ot.home || ot.to || "", work: ot.work || ot.from || "", margin: ot.margin ?? ot.walk ?? 5 };
    delete out.daily; delete out.winEnd;
    return out;
  }
  try {
    const c = JSON.parse(localStorage.getItem(LS_KEY) || "null");
    if (c && c.days) {
      const days = {};
      Object.keys(c.days).forEach(k => { const r = norm(c.days[k]); if (meaningful(r)) days[k] = r; });
      state = { settings: migrateSettings(c.settings), days };
    }
  } catch (e) {}
  const lsWrite = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} };

  // ---------- jours fériés (Genève) ----------
  const holCache = {};
  function easter(y) {
    const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25),
      g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4,
      l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
      month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
    return new Date(y, month - 1, day);
  }
  function holidaysGE(y) {
    if (holCache[y]) return holCache[y];
    const E = easter(y), H = {};
    const add = (d, n) => { H[dateKey(d)] = n; };
    add(new Date(y, 0, 1), "Nouvel An");
    add(addDays(E, -2), "Vendredi saint");
    add(addDays(E, 1), "Lundi de Pâques");
    add(addDays(E, 39), "Ascension");
    add(addDays(E, 50), "Lundi de Pentecôte");
    add(new Date(y, 7, 1), "Fête nationale");
    const s1 = new Date(y, 8, 1); while (s1.getDay() !== 0) s1.setDate(s1.getDate() + 1);
    add(addDays(s1, 4), "Jeûne genevois");
    add(new Date(y, 11, 25), "Noël");
    add(new Date(y, 11, 31), "Restauration de la République");
    return (holCache[y] = H);
  }
  const holidayName = k => state.settings.holidays === "GE" ? holidaysGE(+k.slice(0, 4))[k] || null : null;

  // ---------- core calc ----------
  function baseFor(k) { return state.settings.sched[parseKey(k).getDay()] || 0; }
  function targetFor(k, rec) {
    const base = baseFor(k);
    const type = rec ? rec.type : "work";
    if (type === "ferie" || (holidayName(k) && type === "work")) return 0;
    if (type === "conge" || type === "maladie") return rec.half ? Math.round(base / 2) : 0;
    return base;
  }
  function calc(rec, isToday, k) {
    const s = state.settings, n = nowMin();
    if (!rec) return null;
    const t = targetFor(k, rec);
    const p = (rec.punches || []).map(toMin);
    if (!p.length) {
      if (rec.type === "work") return null;
      return { inside: false, raw: 0, gaps: 0, pauseDue: 0, net: 0, remaining: t, daily: t, first: null, last: null, target: null, complete: true, balance: -t, absence: true };
    }
    if (s.clampStart) p[0] = Math.max(p[0], s.winStart);
    let raw = 0, gaps = 0;
    for (let i = 0; i < p.length; i += 2) {
      const a = p[i], b = i + 1 < p.length ? p[i + 1] : (isToday ? n : null);
      if (b != null) raw += Math.max(0, b - a);
      if (i > 0) gaps += Math.max(0, p[i] - p[i - 1]);
    }
    const inside = p.length % 2 === 1;
    const needsPause = t > 330 || raw > 330;
    const pauseDue = needsPause ? Math.max(0, s.pauseMin - gaps) : 0;
    const net = Math.max(0, raw - pauseDue);
    const remaining = t + (t > 330 ? Math.max(0, s.pauseMin - gaps) : pauseDue) - raw;
    return {
      inside, raw, gaps, pauseDue, net, remaining, daily: t,
      first: p[0], last: p[p.length - 1],
      target: inside && isToday ? n + remaining : null,
      complete: !inside, balance: !inside ? net - t : null
    };
  }
  const calcK = (k, tk) => calc(state.days[k], k === tk, k);
  function totalsOf(keys, tk) {
    let worked = 0, bal = 0, n = 0, target = 0;
    keys.forEach(k => { const r = calcK(k, tk); if (r && r.complete) { worked += r.net; bal += r.balance; target += r.daily; n++; } });
    return { worked, bal, n, target };
  }
  const weekKeys = mon => { const a = []; for (let i = 0; i < 7; i++) a.push(dateKey(addDays(mon, i))); return a; };

  // ---------- persistence ----------
  function saveDay(k, rec) {
    if (rec && meaningful(rec)) state.days[k] = rec; else delete state.days[k];
    lsWrite(); render();
  }
  function saveSettings() { lsWrite(); render(); }

  // ---------- theme ----------
  const TONES = {
    ios:      { name: "iOS",      light: ["#F2F2F7", "#E5E5EA", "#8E8E93", "#C7C7CC"], dark: ["#1C1C1E", "#38383A", "#8E8E93", "#48484A"] },
    neutre:   { name: "Neutre",   light: ["#F2F2F2", "#E6E6E6", "#8A8A8A", "#C4C4C4"], dark: ["#1C1C1C", "#383838", "#8A8A8A", "#4A4A4A"] },
    chaud:    { name: "Chaud",    light: ["#F4F2EF", "#E8E5E1", "#8C8781", "#C9C4BE"], dark: ["#1E1C1A", "#3A3734", "#928C85", "#4C4843"] },
    graphite: { name: "Graphite", light: ["#EBEBED", "#D8D8DC", "#636366", "#AEAEB2"], dark: ["#2C2C2E", "#48484A", "#AEAEB2", "#5A5A5E"] }
  };
  const mq = window.matchMedia ? matchMedia("(prefers-color-scheme: dark)") : null;
  const themeMode = () => { const s = state.settings; return s.theme === "auto" ? (mq && mq.matches ? "dark" : "light") : s.theme; };
  function applyTheme() {
    const mode = themeMode(), root = document.documentElement;
    if (root.dataset.theme !== mode) root.dataset.theme = mode;
    const t = (TONES[state.settings.tone] || TONES.ios)[mode];
    ["--raised", "--hair", "--muted", "--faint"].forEach((v, i) => root.style.setProperty(v, t[i]));
    const mt = document.getElementById("meta-theme"); if (mt) mt.content = mode === "dark" ? "#000000" : "#FFFFFF";
  }
  if (mq && mq.addEventListener) mq.addEventListener("change", () => { render(); if (tab === "set") renderSettings(); });

  // ---------- tabs ----------
  const $ = id => document.getElementById(id);
  let tab = "today";
  const TITLES = { today: 'Balancier<span>.</span>', track: "Suivi", abs: "Absences", set: "Réglages" };
  function showTab(t) {
    tab = t;
    document.querySelectorAll(".tab").forEach(b => { const on = b.dataset.tab === t; b.classList.toggle("on", on); b.setAttribute("aria-current", on ? "page" : "false"); });
    ["today", "track", "abs", "set"].forEach(v => { $("v-" + v).hidden = v !== t; });
    $("title").innerHTML = TITLES[t];
    if (t === "set") renderSettings();
    render();
    window.scrollTo(0, 0);
  }
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { if (b.dataset.tab === "track" && tab !== "track") track.anchor = new Date(); showTab(b.dataset.tab); });

  // ---------- render ----------
  let projOut = null, projDay = null;
  function render() {
    applyTheme();
    const now = new Date();
    $("date").textContent = JL[now.getDay()] + " " + now.getDate() + " " + MOIS[now.getMonth()];
    const rec = state.days[dateKey(now)];
    $("wheel").classList.toggle("on", !!(rec && rec.punches.length % 2 === 1));
    if (tab === "today") renderToday();
    else if (tab === "track") renderTrack();
    else if (tab === "abs") renderAbs();
    tick();
  }

  function renderToday() {
    const now = new Date(), tk = dateKey(now), n = nowMin(), s = state.settings;
    const rec = state.days[tk] || null;
    const c = calc(rec, true, tk);
    const hol = holidayName(tk);
    const t0 = targetFor(tk, rec || { type: "work" });

    const mon = mondayOf(now); let wk = 0, tot = 0, any = false, wkNet = 0;
    Object.keys(state.days).forEach(k => {
      const r = calcK(k, tk); if (!r || !r.complete) return;
      any = true; tot += r.balance;
      if (parseKey(k) >= mon && parseKey(k) < addDays(mon, 7)) { wk += r.balance; wkNet += r.net; }
    });

    const time = $("time"); time.className = "time num";
    const nudge = $("nudge"); nudge.hidden = true; nudge.className = "nudge";
    const setNudge = (txt, warn) => { nudge.textContent = txt; nudge.hidden = false; if (warn) nudge.classList.add("warn"); };

    if (!c) {
      if (t0 === 0) {
        $("kicker").textContent = hol ? "Jour férié" : "Pas de travail prévu";
        time.textContent = hol || "Repos"; time.classList.add("word");
        $("fill").style.width = "0%";
        $("meta-l").textContent = "Si tu pointes, tout compte en plus."; $("meta-r").textContent = "";
      } else {
        const pause = t0 > 330 ? s.pauseMin : 0;
        $("kicker").textContent = "Départ si tu entres maintenant";
        time.textContent = clock(Math.max(n + t0 + pause, s.minOut ?? 0));
        $("fill").style.width = "0%";
        $("meta-l").innerHTML = `${hm(t0)}${pause ? ` + ${pause} min de pause` : ""}`; $("meta-r").textContent = "";
        if (n < s.winStart) setNudge(`Plage d'arrivée dès ${clock(s.winStart)}`);
      }
    } else if (c.absence) {
      $("kicker").textContent = rec.half ? "Demi-journée" : "Aujourd'hui";
      time.textContent = TYPES[rec.type] + (rec.half ? " ½" : ""); time.classList.add("word");
      $("fill").style.width = "0%";
      $("meta-l").innerHTML = rec.type === "recup" ? `<b>${signed(c.balance)}</b> sur ton compteur` : (rec.half ? `Reste <b>${hm(c.daily)}</b> à pointer` : "Journée sans pointage");
      $("meta-r").textContent = "";
    } else if (c.inside) {
      const blocked = s.minOut != null && s.minOut > c.target && c.daily > 330;
      const leave = blocked ? s.minOut : c.target;
      $("kicker").textContent = blocked ? `Départ · pas avant ${clock(s.minOut)}` : "Départ";
      time.textContent = clock(leave);
      $("fill").style.width = Math.min(100, c.raw / Math.max(1, c.raw + Math.max(0, c.remaining)) * 100).toFixed(1) + "%";
      $("meta-l").innerHTML = `<b>${hm(c.raw)}</b> de présence`;
      if (blocked) $("meta-r").innerHTML = c.remaining > 0 ? `${hm(c.daily)} atteintes à <b>${clock(c.target)}</b>` : `<b class="pos">${signed(-c.remaining)}</b> · encore <b>${hm(s.minOut - n)}</b>`;
      else if (c.remaining > 0 && c.remaining <= 30) $("meta-r").innerHTML = `plus que <b>${c.remaining} min</b>`;
      else $("meta-r").innerHTML = c.remaining > 0 ? `encore <b>${hm(c.remaining)}</b>` : `<b class="pos">${signed(-c.remaining)}</b>`;
      if (c.gaps === 0 && c.raw >= 330 && c.daily > 330) setNudge("Plus de 5h30 sans pause : pense à souffler.", true);
      else if (c.remaining <= 0 && !blocked) setNudge("Tes heures sont faites. Bonne fin de journée !");
    } else {
      $("kicker").textContent = `Sorti à ${clock(c.last)} · solde du jour`;
      time.textContent = signed(c.balance); time.classList.add(c.balance >= 0 ? "pos" : "neg");
      $("fill").style.width = Math.min(100, c.daily ? c.net / c.daily * 100 : 100).toFixed(1) + "%";
      $("meta-l").innerHTML = `<b>${hm(c.net)}</b> comptées`;
      $("meta-r").textContent = c.pauseDue > 0 ? `pause ${s.pauseMin} min déduite` : (c.gaps ? `pause ${hm(c.gaps)}` : "");
    }
    if (s.maxWeek && wkNet > s.maxWeek) setNudge(`${hm(wkNet)} cette semaine : au-dessus de ton maximum de ${hm(s.maxWeek)}.`, true);

    const tags = [];
    if (rec && rec.type !== "work") tags.push(TYPES[rec.type] + (rec.half ? " ½" : ""));
    if (rec && rec.remote) tags.push("Télétravail");
    if (hol && !(rec && rec.type === "ferie")) tags.push(hol);
    $("day-tag").textContent = tags.join(" · ");
    const pun = rec ? rec.punches : [];
    $("punches").innerHTML = pun.length
      ? pun.map((t, i) => `<button class="p ${i % 2 ? "out" : "in"}" data-edit><small>${i % 2 ? "Sortie" : "Entrée"}</small><b class="num">${t}</b></button>`).join("")
      : `<span class="p empty">Aucun pointage pour l'instant</span>`;

    const nextIsIn = pun.length % 2 === 0;
    $("btn-in").classList.toggle("on", nextIsIn); $("btn-out").classList.toggle("on", !nextIsIn);
    $("btn-in").setAttribute("aria-disabled", String(!nextIsIn)); $("btn-out").setAttribute("aria-disabled", String(nextIsIn));

    $("week").innerHTML = any && !(c && !c.absence) ? `<span>Semaine <b class="num ${wk >= 0 ? "pos" : "neg"}">${signed(wk)}</b></span><span>Cumul <b class="num ${tot >= 0 ? "pos" : "neg"}">${signed(tot)}</b></span>` : "";

    const sg = m => `<b class="${m >= 0 ? "pos" : "neg"}">${signed(m)}</b>`;
    const proj = $("proj"), inp = $("proj-out");
    proj.hidden = !c || (c.absence && rec.type !== "recup" && !rec.half);
    let leaveAt = null;
    if (c && c.inside) {
      if (projDay !== tk) { projDay = tk; projOut = null; }
      const auto = s.minOut != null && c.daily > 330 ? Math.max(c.target, s.minOut) : c.target;
      const L = projOut != null ? projOut : auto;
      leaveAt = L;
      if (document.activeElement !== inp) inp.value = clock(L);
      $("proj-txt").textContent = projOut != null ? "Si tu sors à" : "À ta sortie,";
      inp.hidden = false;
      const pb = L - c.target;
      $("proj-bal").className = "num " + (pb >= 0 ? "pos" : "neg"); $("proj-bal").textContent = signed(pb);
      $("proj-wk").innerHTML = `${signed(wk)} → ${sg(wk + pb)}`;
      $("proj-tot").innerHTML = `${signed(tot)} → ${sg(tot + pb)}`;
      const w = $("proj-warn"), msgs = [];
      if (s.minOut != null && L < s.minOut && c.daily > 330) msgs.push(`Avant ${clock(s.minOut)} : accord de la direction nécessaire.`);
      const wkProj = wkNet + Math.max(0, c.raw + (L - n) - c.pauseDue);
      if (s.maxWeek && wkProj > s.maxWeek) msgs.push(`Semaine projetée à ${hm(wkProj)}, au-dessus de ${hm(s.maxWeek)}.`);
      w.textContent = msgs.join(" "); w.hidden = !msgs.length;
    } else if (c) {
      $("proj-txt").textContent = "Ajouté aujourd'hui";
      inp.hidden = true; $("proj-warn").hidden = true;
      $("proj-bal").className = "num " + (c.balance >= 0 ? "pos" : "neg"); $("proj-bal").textContent = signed(c.balance);
      $("proj-wk").innerHTML = `${signed(wk - c.balance)} → ${sg(wk)}`;
      $("proj-tot").innerHTML = `${signed(tot - c.balance)} → ${sg(tot)}`;
    }
    if (!c && t0 > 0) renderTransit("aller", n);
    else if (c && c.inside) renderTransit("retour", leaveAt);
    else renderTransit(null);
  }
  $("proj-out").addEventListener("change", e => { projOut = toMin(e.target.value); render(); });

  // ---------- trajets domicile <-> travail (transport.opendata.ch) ----------
  const trCfg = () => { const t = state.settings.transit || {}; return { home: t.home || "", work: t.work || "", margin: t.margin ?? 5 }; };
  const CAT = { T: "Tram", NFT: "Tram", B: "Bus", BUS: "Bus", NFB: "Bus", KB: "Bus", S: "Train", SN: "Train", SL: "Léman Express", R: "Train", RE: "RegioExpress", IR: "InterRegio", IC: "InterCity", ICE: "ICE", TGV: "TGV", TER: "TER", EC: "EuroCity", BAT: "Bateau", M: "Métro" };
  const short1 = s => String(s || "").replace(/^Genève,\s*/, "");
  const durMin = d => { if (d == null) return 0; if (typeof d === "number") return Math.round(d / 60); const m = String(d).match(/(?:(\d+)d)?(\d+):(\d+)(?::(\d+))?/); return m ? (+(m[1] || 0)) * 1440 + (+m[2]) * 60 + (+m[3]) : 0; };
  const hhmmIso = iso => { const d = new Date(iso); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
  const minIso = iso => { const d = new Date(iso); return d.getHours() * 60 + d.getMinutes(); };
  function lineLabel(j) {
    const cat = String(j.category || "").toUpperCase(), num = String(j.number || "").trim();
    const base = CAT[cat] || j.category || "Transport";
    if (/^L\d/.test(num)) return "Léman Express " + num;
    return num && num !== cat ? base + " " + num : base;
  }
  let trKey = null, trData = null, trBusy = false, trMeta = null;
  function renderTransit(dir, atMin) {
    const cfg = trCfg(), box = $("transit");
    if (!cfg.home || !cfg.work || dir == null) { box.hidden = true; return; }
    box.hidden = false;
    const from = dir === "aller" ? cfg.home : cfg.work, to = dir === "aller" ? cfg.work : cfg.home;
    const t = dir === "retour" ? atMin + cfg.margin : atMin;
    $("transit-title").textContent = dir === "aller" ? `Aller · ${short1(from)} → ${short1(to)}` : `Retour · ${short1(from)} → ${short1(to)}`;
    const bucket = Math.floor(Date.now() / 180000); // rafraîchi toutes les 3 min (temps réel)
    const key = [dir, from, to, t, dateKey(new Date()), bucket].join("|");
    if (key !== trKey) { trKey = key; if (!trMeta || trMeta.dir !== dir || trMeta.t !== t) trData = null; trMeta = { dir, t }; fetchTransit(from, to, t, key); }
    const list = $("transit-list");
    if (trData === null) { list.innerHTML = `<div class="dep"><span>Recherche des horaires…</span></div>`; return; }
    if (trData.error) { list.innerHTML = `<div class="dep"><span>${esc(trData.error)}</span></div>`; return; }
    if (!trData.length) { list.innerHTML = `<div class="dep"><span>Aucun trajet trouvé après ${clock(t)}.</span></div>`; return; }
    const first = trData[0];
    const leave = dir === "retour" ? first.depMin - (first.startsWalking ? 0 : cfg.margin) : first.depMin;
    const lines = cn => cn.legs.filter(l => l.kind === "ride").map(l => `<span class="chipline">${esc(l.line)}</span>`).join(`<span class="sep">›</span>`);
    const delay = cn => cn.delay > 0 ? ` <span class="late">+${cn.delay} min</span>` : "";
    let head;
    if (dir === "retour") head = `<div class="tr-main"><div><span class="tr-k">Quitte le travail à</span><b class="num">${clock(leave)}</b></div><div class="tr-r"><span class="tr-k">Arrivée</span><b class="num">${first.arr}</b></div></div>`;
    else {
      const sched = baseFor(dateKey(new Date())), pause = sched > 330 ? state.settings.pauseMin : 0;

  async function fetchTransit(from, to, t, key) {

        + "&date=" + dateKey(new Date()) + "&time=" + clock(t) + "&limit=4";
      const r = await fetch(url);
      if (!r.ok) throw new Error("http");
      const j = await r.json();
      const out = (j.connections || []).map(cn => {
        const legs = (cn.sections || []).map(sc => sc.journey ? {
          kind: "ride", line: lineLabel(sc.journey), dir: short1(sc.journey.to || ""),
          from: short1(sc.departure && sc.departure.station && sc.departure.station.name), to: short1(sc.arrival && sc.arrival.station && sc.arrival.station.name),
          dep: hhmmIso(sc.departure.departure), arr: hhmmIso(sc.arrival.arrival), delay: (sc.departure && sc.departure.delay) || 0,
          platform: (sc.departure && (sc.departure.prognosis && sc.departure.prognosis.platform || sc.departure.platform)) || ""

          dur: durMin(cn.duration), transfers: cn.transfers || 0, delay: cn.from.delay || (legs.find(l => l.kind === "ride") || {}).delay || 0,

  // ---------- chart: cumulative balance ----------
  const CW = 340, CH = 180, CL = 42, CR = 12, CT = 12, CB = 24;
  function chartSVG(pts, slots, xlabels) {
    if (!pts.length) return `<svg viewBox="0 0 ${CW} ${CH}" role="img" aria-label="Aucune donnée"><text class="empty" x="${CW / 2}" y="${CH / 2}" text-anchor="middle">Pas encore de journée terminée sur cette période</text></svg>`;
    const vals = pts.map(p => p.cum);
    let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
    const steps = [15, 30, 60, 120, 180, 240, 360, 480, 600, 900, 1200, 1800, 2400];
    const step = steps.find(st => (Math.ceil(hi / st) - Math.floor(lo / st)) <= 4) || 2400;
    lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
    if (hi === lo) hi += step;
    const x = s => CL + (slots <= 1 ? (CW - CL - CR) / 2 : s * (CW - CL - CR) / (slots - 1));
    const y = v => CT + (hi - v) * (CH - CT - CB) / (hi - lo);
    const lab = v => v === 0 ? "0" : (v > 0 ? "+" : "−") + (Math.abs(v) % 60 ? hm(Math.abs(v)) : Math.abs(v) / 60 + "h");
    let g = "";
    for (let v = lo; v <= hi + .1; v += step) {
      g += v === 0 ? `<line class="zero" x1="${CL}" x2="${CW - CR}" y1="${y(0)}" y2="${y(0)}"/>` : `<line class="grid" x1="${CL}" x2="${CW - CR}" y1="${y(v)}" y2="${y(v)}"/>`;
      g += `<text class="ylab" x="${CL - 6}" y="${y(v) + 3.5}" text-anchor="end">${lab(v)}</text>`;
    }
    xlabels.forEach(l => { g += `<text class="xlab" x="${x(l.slot)}" y="${CH - 6}" text-anchor="middle">${esc(l.text)}</text>`; });
    const line = pts.map((p, i) => (i ? "L" : "M") + x(p.slot).toFixed(1) + " " + y(p.cum).toFixed(1)).join(" ");
    const area = line + ` L${x(pts[pts.length - 1].slot).toFixed(1)} ${y(0).toFixed(1)} L${x(pts[0].slot).toFixed(1)} ${y(0).toFixed(1)} Z`;
    const dots = pts.map((p, i) => `<circle class="pt" data-i="${i}" cx="${x(p.slot).toFixed(1)}" cy="${y(p.cum).toFixed(1)}" r="${pts.length > 16 ? 3 : 4}"/>`).join("");
    return `<svg viewBox="0 0 ${CW} ${CH}" role="img" aria-label="Évolution du solde cumulé">${g}
      ${pts.length > 1 ? `<path class="area" d="${area}"/><path class="line" d="${line}"/>` : ""}
      <line class="cross" id="ch-cross" x1="0" x2="0" y1="${CT}" y2="${CH - CB}" visibility="hidden"/>
      ${dots}
      <rect id="ch-hit" x="${CL - 12}" y="0" width="${CW - CL - CR + 24}" height="${CH}" fill="transparent"/>
    </svg>`;
  }
  function bindChart(root, pts, slots) {
    const svg = root.querySelector("svg"), hit = root.querySelector("#ch-hit");
    const readL = root.querySelector(".readout .l"), readV = root.querySelector(".readout .v");
    const show = i => {
      const p = pts[i]; if (!p) return;
      readL.innerHTML = `<b>${esc(p.label)}</b>Jour ${signed(p.day)} · cumul`;
      readV.textContent = signed(p.cum); readV.className = "v num " + (p.cum >= 0 ? "pos" : "neg");
      root.querySelectorAll(".pt").forEach(c => c.classList.toggle("sel", +c.dataset.i === i));
      const cr = root.querySelector("#ch-cross"), dot = root.querySelector(`.pt[data-i="${i}"]`);
      if (cr && dot) { cr.setAttribute("x1", dot.getAttribute("cx")); cr.setAttribute("x2", dot.getAttribute("cx")); cr.setAttribute("visibility", "visible"); }
    };
    if (!pts.length) { readL.innerHTML = "<b>Solde cumulé</b>Aucune donnée"; readV.textContent = "—"; readV.className = "v num"; return; }
    show(pts.length - 1);
    if (!hit) return;
    const pick = e => {
      const r = svg.getBoundingClientRect(), sx = (e.clientX - r.left) * CW / r.width;
      const slot = (sx - CL) / ((CW - CL - CR) / Math.max(1, slots - 1));
      let best = 0, bd = Infinity; pts.forEach((p, i) => { const dd = Math.abs(p.slot - slot); if (dd < bd) { bd = dd; best = i; } });
      show(best);
    };
    hit.addEventListener("pointerdown", pick);
    hit.addEventListener("pointermove", e => { if (e.pointerType === "mouse" || e.buttons) pick(e); });
  }

  // ---------- Suivi ----------
  let track = { mode: "week", anchor: new Date() };
  const balHtml = m => `<span class="r num ${m >= 0 ? "pos" : "neg"}">${signed(m)}</span>`;
  const avgClock = arr => arr.length ? clock(arr.reduce((a, b) => a + b, 0) / arr.length) : "—";

  function renderTrack() {
    const now = new Date(), tk = dateKey(now), { mode, anchor } = track, s = state.settings;
    let title, sub, detail = "", keys = [], isCurrent, pts = [], slots, xl = [], warn = "";
    if (mode === "week") {
      const mon = mondayOf(anchor);
      isCurrent = dateKey(mon) === dateKey(mondayOf(now));
      title = "Semaine " + isoWeek(mon); sub = short(mon) + " – " + short(addDays(mon, 6));
      keys = weekKeys(mon);
      const weekendUsed = keys.slice(5).some(k => state.days[k] || baseFor(k));
      slots = weekendUsed ? 7 : 5;
      for (let i = 0; i < slots; i++) xl.push({ slot: i, text: J[addDays(mon, i).getDay()].replace(".", "") });
      let cum = 0;
      const rows = [];
      keys.forEach((k, i) => {
        const d = parseKey(k), r = state.days[k], hol = holidayName(k), base = baseFor(k), c = r && calc(r, k === tk, k);
        if (c && c.complete) { cum += c.balance; if (i < slots) pts.push({ slot: i, label: longDate(d), day: c.balance, cum }); }
        if (!r && !base && !hol) return;
        const future = d > now && !r;
        let right, det, cls = "";
        if (c && c.complete) right = balHtml(c.balance);
        else if (c) right = `<span class="r" style="color:var(--muted)">${k === tk ? "en cours" : "incomplet"}</span>`;
        else right = `<span class="r" style="color:var(--faint)">—</span>`;
        const tag = r && r.type !== "work" ? `<span class="tag">${TYPES[r.type]}${r.half ? " ½" : ""}</span>` : (hol ? `<span class="tag">Férié</span>` : "");
        const rem = r && r.remote ? `<span class="tag">Télétravail</span>` : "";
        if (r && r.punches.length) det = `${clock(c.first)} → ${c.complete ? clock(c.last) : "…"} · ${hm(c.complete ? c.net : c.raw)}`;
        else if (r) det = r.type === "recup" ? "pris sur le compteur" : "sans pointage";
        else if (hol) { det = hol; cls = " off"; }
        else det = future ? "à venir" : "pas de pointage";
        const pct = c && c.daily ? Math.min(100, (c.complete ? c.net : c.raw) / c.daily * 100) : 0;
        rows.push(`<button class="item${future ? " future" : ""}${cls}" data-day="${k}"><span>${J[d.getDay()]} ${d.getDate()}${tag}${rem}<small class="num">${esc(det)}</small>${r && r.punches.length ? `<span class="mini"><i class="${pct >= 100 ? "full" : ""}" style="width:${pct.toFixed(0)}%"></i></span>` : ""}</span>${right}</button>`);
      });
      const t = totalsOf(keys, tk);
      if (s.maxWeek && t.worked > s.maxWeek) warn = `<p class="err">${hm(t.worked)} travaillées : au-dessus de ton maximum hebdo de ${hm(s.maxWeek)}.</p>`;
      detail = `<h4>Détail par jour</h4><div class="list">${rows.join("")}</div>`;
    } else {
      const y = anchor.getFullYear(), m = anchor.getMonth(), first = new Date(y, m, 1), lastD = new Date(y, m + 1, 0);
      isCurrent = y === now.getFullYear() && m === now.getMonth();
      title = MOIS[m].charAt(0).toUpperCase() + MOIS[m].slice(1) + " " + y;
      slots = lastD.getDate();
      [1, 8, 15, 22, lastD.getDate()].forEach(dn => xl.push({ slot: dn - 1, text: String(dn) }));
      for (let d = 1; d <= lastD.getDate(); d++) { const k = dateKey(new Date(y, m, d)); if (state.days[k]) keys.push(k); }
      let cum = 0;
      const ins = [], outs = [], worked = []; let remote = 0;
      keys.forEach(k => {
        const r = state.days[k], c = calcK(k, tk), d = parseKey(k);
        if (r.remote) remote++;
        if (c && c.complete && r.punches.length) { ins.push(c.first); outs.push(c.last); worked.push(c.net); }
        if (c && c.complete) { cum += c.balance; pts.push({ slot: d.getDate() - 1, label: longDate(d), day: c.balance, cum }); }
      });
      sub = keys.length + " jour" + (keys.length > 1 ? "s" : "") + " enregistré" + (keys.length > 1 ? "s" : "");
      const weeks = []; let mon = mondayOf(first);
      while (mon <= lastD && mon <= now) {
        const wk = keys.filter(k => { const d = parseKey(k); return d >= mon && d < addDays(mon, 7); });
        const t = totalsOf(wk, tk);
        const a = mon < first ? first : mon, b = addDays(mon, 6) > lastD ? lastD : addDays(mon, 6);
        weeks.push(`<button class="item" data-week="${dateKey(mon)}"><span>Semaine ${isoWeek(mon)}<small>${short(a)} – ${short(b)} · ${t.n} jour${t.n > 1 ? "s" : ""} · ${hm(t.worked)}</small></span>${t.n ? balHtml(t.bal) : `<span class="r" style="color:var(--faint)">—</span>`}</button>`);
        mon = addDays(mon, 7);
      }
      detail = `<div class="sum small"><div>Arrivée moy.<b class="num">${avgClock(ins)}</b></div><div>Sortie moy.<b class="num">${avgClock(outs)}</b></div><div>Par jour<b class="num">${worked.length ? hm(worked.reduce((a, b) => a + b, 0) / worked.length) : "—"}</b></div></div>
        <h4>Détail par semaine</h4>
        ${weeks.length ? `<div class="list">${weeks.join("")}</div>` : `<p class="note" style="margin:0 16px">Rien à afficher pour ce mois.</p>`}
        ${remote ? `<p class="note" style="margin-top:0">${remote} jour${remote > 1 ? "s" : ""} de télétravail ce mois.</p>` : ""}
        <button class="ghost" id="h-export">Exporter le mois (tableur)</button>`;
    }
    const t = totalsOf(keys, tk);
    const v = $("v-track");
    v.innerHTML = `<div class="page">
      <div class="seg" role="tablist"><button data-mode="week" class="${mode === "week" ? "on" : ""}">Semaine</button><button data-mode="month" class="${mode === "month" ? "on" : ""}">Mois</button></div>
      <div class="nav"><button id="tr-prev" aria-label="Précédent">‹</button><div>${title}<small>${sub}</small></div><button id="tr-next" aria-label="Suivant" ${isCurrent ? "disabled" : ""}>›</button></div>
      <div class="chart" id="chart"><div class="readout"><span class="l"></span><span class="v num"></span></div>${chartSVG(pts, slots, xl)}</div>
      <div class="sum"><div>Solde<b class="num ${t.n ? (t.bal >= 0 ? "pos" : "neg") : ""}">${t.n ? signed(t.bal) : "—"}</b></div><div>Travaillé<b class="num">${hm(t.worked)}</b></div><div>Prévu<b class="num">${hm(t.target)}</b></div></div>
      ${warn}${detail}
      <button class="ghost" id="h-add">Ajouter une journée</button>
    </div>`;
    bindChart($("chart"), pts, slots);
    v.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { track.mode = b.dataset.mode; renderTrack(); });
    v.querySelectorAll("[data-day]").forEach(b => b.onclick = () => openDay(b.dataset.day, !state.days[b.dataset.day]));
    v.querySelectorAll("[data-week]").forEach(b => b.onclick = () => { track = { mode: "week", anchor: parseKey(b.dataset.week) }; renderTrack(); window.scrollTo(0, 0); });
    const step = dir => { const a = new Date(track.anchor); if (track.mode === "week") a.setDate(a.getDate() + 7 * dir); else { a.setDate(1); a.setMonth(a.getMonth() + dir); } track.anchor = a; renderTrack(); };
    $("tr-prev").onclick = () => step(-1);
    $("tr-next").onclick = () => step(1);
    $("h-add").onclick = () => { const y = new Date(); y.setDate(y.getDate() - 1); openDay(dateKey(y), true); };
    if ($("h-export")) $("h-export").onclick = () => exportMonth(anchor.getFullYear(), anchor.getMonth());
  }

  function exportMonth(y, m) {
    const tk = dateKey(new Date()), lastD = new Date(y, m + 1, 0).getDate();
    const lines = [["Date", "Jour", "Type", "Télétravail", "Pointages", "Travaillé", "Prévu", "Solde"].join(";")];
    let tot = 0;
    for (let d = 1; d <= lastD; d++) {
      const k = dateKey(new Date(y, m, d)), r = state.days[k], hol = holidayName(k);
      if (!r && !hol) continue;
      const c = calcK(k, tk);
      if (c && c.complete) tot += c.balance;
      lines.push([k, JL[parseKey(k).getDay()], r ? TYPES[r.type] + (r.half ? " (1/2)" : "") : "Férié" + (hol ? " - " + hol : ""), r && r.remote ? "oui" : "",
        r ? r.punches.join(" ") : "", c && c.complete ? hm(c.net) : "", c ? hm(c.daily) : "", c && c.complete ? signed(c.balance).replace("−", "-") : ""].join(";"));
    }
    lines.push(["Total", "", "", "", "", "", "", signed(tot).replace("−", "-")].join(";"));
    shareFile(`balancier-${y}-${pad(m + 1)}.csv`, "﻿" + lines.join("\n"), "text/csv");
  }
  async function shareFile(name, text, type) {
    const blob = new Blob([text], { type });
    try {
      const file = new File([blob], name, { type });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return true; }
    } catch (e) { if (e && e.name === "AbortError") return false; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
    toast("Fichier " + name + " exporté"); return true;
  }

  // ---------- Absences ----------
  function renderAbs() {
    const now = new Date(), tk = dateKey(now), y = now.getFullYear(), s = state.settings;
    const yk = Object.keys(state.days).filter(k => k.startsWith(String(y))).sort();
    let vacTaken = 0, vacPlanned = 0, sick = 0, recup = 0, remote = 0;
    yk.forEach(k => {
      const r = state.days[k], amt = r.half ? .5 : 1;
      if (r.type === "conge") { if (k <= tk) vacTaken += amt; else vacPlanned += amt; }
      if (r.type === "maladie") sick += amt;
      if (r.type === "recup") recup += 1;
      if (r.remote) remote++;
    });
    const left = s.vacDays - vacTaken - vacPlanned;
    const pct = s.vacDays ? Math.min(100, (vacTaken + vacPlanned) / s.vacDays * 100) : 0;
    const upcoming = Object.keys(state.days).filter(k => k > tk && state.days[k].type !== "work").sort().slice(0, 8);
    const H = { ...holidaysGE(y), ...holidaysGE(y + 1) };
    const nextHol = s.holidays === "GE" ? Object.keys(H).filter(k => k > tk).sort().slice(0, 4) : [];
    const past = yk.filter(k => k <= tk && state.days[k].type !== "work").reverse().slice(0, 12);
    const absRow = k => { const r = state.days[k]; return `<button class="item" data-day="${k}"><span>${longDate(parseKey(k))}<small>${TYPES[r.type]}${r.half ? " · demi-journée" : ""}${r.remote ? " · télétravail" : ""}</small></span><span class="r" style="color:var(--muted)">›</span></button>`; };
    $("v-abs").innerHTML = `<div class="page">
      <div class="card" style="margin-top:0">
        <div class="card-title">Congés ${y}</div>
        <div class="big"><b class="num">${fmtDays(left)}</b><span>jour${Math.abs(left) > 1 ? "s" : ""} restant${Math.abs(left) > 1 ? "s" : ""} sur ${fmtDays(s.vacDays)}</span></div>
        <div class="bar" style="margin-top:0"><i style="width:${pct.toFixed(1)}%"></i></div>
        <div class="rows">
          <div class="rowx"><span>Pris</span><b class="num" style="color:var(--fg)">${fmtDays(vacTaken)} j</b></div>
          <div class="rowx"><span>Planifiés</span><b class="num" style="color:var(--fg)">${fmtDays(vacPlanned)} j</b></div>
        </div>
      </div>
      <div class="sum small"><div>Maladie<b class="num">${fmtDays(sick)} j</b></div><div>Récup.<b class="num">${recup} j</b></div><div>Télétravail<b class="num">${remote}${s.remoteCap ? `/${s.remoteCap}` : ""} j</b></div></div>
      ${s.remoteCap && remote > s.remoteCap ? `<p class="err">Plafond de télétravail dépassé (${remote} / ${s.remoteCap} jours).</p>` : ""}
      <button class="cta" id="ab-add">Poser une absence</button>
      <h4>À venir</h4>
      ${upcoming.length ? `<div class="list">${upcoming.map(absRow).join("")}</div>` : `<p class="note" style="margin:0 16px">Aucune absence planifiée.</p>`}
      ${nextHol.length ? `<h4>Prochains jours fériés</h4><div class="list">${nextHol.map(k => `<div class="item off"><span>${longDate(parseKey(k))}${parseKey(k).getFullYear() !== y ? " " + parseKey(k).getFullYear() : ""}<small>${esc(H[k])}</small></span></div>`).join("")}</div>` : ""}
      ${past.length ? `<h4>Déjà pris en ${y}</h4><div class="list">${past.map(absRow).join("")}</div>` : ""}
    </div>`;
    $("ab-add").onclick = () => openRange();
    $("v-abs").querySelectorAll("[data-day]").forEach(b => b.onclick = () => openDay(b.dataset.day));
  }

  function openRange(draft) {
    const today = dateKey(new Date());
    const d = draft || { from: today, to: today, type: "conge", half: false };
    const single = d.from === d.to;
    openSheet(`<h3>Poser une absence</h3>
      <div class="list">
        <label class="item"><span>Du</span><input type="date" id="rg-from" value="${d.from}"></label>
        <label class="item"><span>Au</span><input type="date" id="rg-to" value="${d.to}"></label>
      </div>
      <div class="list"><div class="chips">${["conge", "maladie", "recup"].map(t => `<button class="chip${d.type === t ? " on" : ""}" data-type="${t}">${TYPES[t]}</button>`).join("")}</div>
        ${single && d.type !== "recup" ? `<label class="item"><span>Demi-journée</span><input type="checkbox" class="toggle" id="rg-half" ${d.half ? "checked" : ""}></label>` : ""}
      </div>
      <p class="note" id="rg-info"></p>
      <p class="err" id="rg-err" hidden></p>
      <div class="row"><button class="ghost" id="rg-cancel">Annuler</button><button class="cta" id="rg-save">Enregistrer</button></div>`);
    const read = () => ({ from: $("rg-from").value, to: $("rg-to").value, type: d.type, half: $("rg-half") ? $("rg-half").checked : false });
    const daysIn = x => { const out = []; if (!x.from || !x.to) return out; let a = parseKey(x.from); const b = parseKey(x.to); while (a <= b && out.length < 370) { const k = dateKey(a); if (baseFor(k) && !holidayName(k)) out.push(k); a = addDays(a, 1); } return out; };
    const info = () => { const x = read(), n = daysIn(x).length; $("rg-info").textContent = n ? `${n === 1 && x.half ? "½ jour ouvré" : n + " jour" + (n > 1 ? "s" : "") + " ouvré" + (n > 1 ? "s" : "")} (week-ends et fériés exclus).` : "Aucun jour ouvré dans cette période."; };
    info();
    ["rg-from", "rg-to"].forEach(id => $(id).addEventListener("change", () => {
      if (id === "rg-from" && $("rg-to").value < $("rg-from").value) $("rg-to").value = $("rg-from").value;
      const y = read(); if ((y.from === y.to) !== single) openRange(y); else info();
    }));
    if ($("rg-half")) $("rg-half").addEventListener("change", info);
    scrim.querySelectorAll("[data-type]").forEach(b => b.onclick = () => { const x = read(); x.type = b.dataset.type; if (x.type === "recup") x.half = false; openRange(x); });
    $("rg-cancel").onclick = closeSheet;
    $("rg-save").onclick = () => {
      const x = read(), ks = daysIn(x), err = m => { $("rg-err").textContent = m; $("rg-err").hidden = false; };
      if (x.to < x.from) return err("La date de fin doit être après la date de début.");
      if (!ks.length) return err("Aucun jour ouvré à poser dans cette période.");
      ks.forEach(k => { const ex = state.days[k] || { punches: [], type: "work", half: false, remote: false }; state.days[k] = { ...ex, type: x.type, half: ks.length === 1 ? x.half : false }; });
      lsWrite(); closeSheet(); render();
      toast(`${ks.length === 1 && x.half ? "½ jour" : ks.length + " jour" + (ks.length > 1 ? "s" : "")} · ${TYPES[x.type]}`);
    };
  }

  // ---------- Réglages ----------
  function renderSettings() {
    const s = state.settings, D = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi", "Dimanche"], idx = [1, 2, 3, 4, 5, 6, 0];
    const mode = themeMode();
    const v = $("v-set");
    v.innerHTML = `<div class="page">
      <h4>Apparence</h4>
      <div class="list">
        <div style="padding:12px 16px"><div class="seg">${[["auto", "Auto"], ["light", "Clair"], ["dark", "Sombre"]].map(([val, l]) => `<button data-theme="${val}" class="${s.theme === val ? "on" : ""}">${l}</button>`).join("")}</div></div>
        <div class="tones" style="border-top:.5px solid var(--hair)">${Object.keys(TONES).map(k => { const c = TONES[k][mode]; return `<button class="tone${(s.tone || "ios") === k ? " on" : ""}" data-tone="${k}"><i style="background:${c[0]};box-shadow:inset 0 0 0 1px ${c[1]}, inset 0 -14px 0 ${c[2]}"></i>${TONES[k].name}</button>`; }).join("")}</div>
      </div>
      <h4>Horaire de la semaine</h4>
      <div class="list">${idx.map((di, i) => `<label class="item"><span>${D[i]}</span><input type="time" data-sched="${di}" value="${s.sched[di] ? clock(s.sched[di]) : ""}"></label>`).join("")}</div>
      <p class="note">Durée à faire chaque jour. Laisse vide pour un jour non travaillé.</p>
      <h4>Règles</h4>
      <div class="list">
        <label class="item"><span>Pause minimum (min)</span><input type="number" inputmode="numeric" min="0" max="180" id="st-pause" value="${s.pauseMin}" style="max-width:70px"></label>
        <label class="item"><span>Arrivée possible dès</span><input type="time" id="st-ws" value="${clock(s.winStart)}"></label>
        <label class="item"><span>Compter seulement dès cette heure</span><input type="checkbox" class="toggle" id="st-clamp" ${s.clampStart ? "checked" : ""}></label>
        <label class="item"><span>Sortie au plus tôt<small>Vide = pas de limite</small></span><input type="time" id="st-minout" value="${s.minOut != null ? clock(s.minOut) : ""}"></label>
        <label class="item"><span>Maximum par semaine (h)</span><input type="number" inputmode="decimal" min="0" max="80" step="0.5" id="st-maxw" value="${s.maxWeek ? s.maxWeek / 60 : ""}" style="max-width:70px"></label>
      </div>
      <h4>Absences</h4>
      <div class="list">
        <label class="item"><span>Jours fériés</span><select id="st-hol"><option value="GE" ${s.holidays === "GE" ? "selected" : ""}>Genève</option><option value="none" ${s.holidays !== "GE" ? "selected" : ""}>Aucun</option></select></label>
        <label class="item"><span>Jours de congé par an</span><input type="number" inputmode="decimal" min="0" max="60" step="0.5" id="st-vac" value="${s.vacDays}" style="max-width:70px"></label>
        <label class="item"><span>Télétravail max par an (j)<small>Vide = pas de plafond</small></span><input type="number" inputmode="numeric" min="0" max="365" id="st-rcap" value="${s.remoteCap || ""}" style="max-width:70px"></label>
      </div>
      <h4>Trajets</h4>
      <div class="list">
        <label class="item"><span>Domicile</span><input type="text" id="st-home" list="dl-stops" placeholder="Adresse ou arrêt" value="${esc(s.transit.home)}" autocomplete="off"></label>
        <label class="item"><span>Travail</span><input type="text" id="st-work" list="dl-stops" placeholder="Adresse ou arrêt" value="${esc(s.transit.work)}" autocomplete="off"></label>
        <label class="item"><span>Temps pour quitter le travail (min)<small>Vestiaire, badge, ascenseur…</small></span><input type="number" inputmode="numeric" min="0" max="60" id="st-margin" value="${s.transit.margin}" style="max-width:70px"></label>
      </div>
      <datalist id="dl-stops"></datalist>
      <p class="note">Le matin, Balancier affiche le prochain départ de chez toi. En poste, il te dit quand quitter le travail pour attraper le bon transport. Horaires et retards en temps réel (CFF, TPG, Léman Express…).</p>
      <button class="cta" id="st-save">Enregistrer les réglages</button>
      <h4>Sauvegarde</h4>
      <p class="note" style="margin-top:0">Tes pointages sont enregistrés sur cet iPhone. Exporte une copie de temps en temps (dans Fichiers ou iCloud Drive).</p>
      <div class="row"><button class="ghost" id="bk-exp">Exporter</button><label class="ghost">Importer<input type="file" id="bk-imp" accept="application/json,.json" hidden></label></div>
      <p class="note" id="bk-msg" hidden></p>
    </div>`;
    v.querySelectorAll("[data-tone]").forEach(b => b.onclick = () => { state.settings.tone = b.dataset.tone; saveSettings(); renderSettings(); });
    v.querySelectorAll("[data-theme]").forEach(b => b.onclick = () => { state.settings.theme = b.dataset.theme; saveSettings(); renderSettings(); });
    let acT;
    ["st-home", "st-work"].forEach(id => $(id).addEventListener("input", e => {
      clearTimeout(acT); const q = e.target.value.trim(); if (q.length < 3) return;
      acT = setTimeout(async () => {
        try {
          const r = await fetch("https://transport.opendata.ch/v1/locations?type=all&query=" + encodeURIComponent(q));
          const j = await r.json();
          $("dl-stops").innerHTML = (j.stations || []).filter(x => x.name).slice(0, 8).map(x => `<option value="${esc(x.name)}">`).join("");
        } catch (err) {}
      }, 300);
    }));
    $("st-save").onclick = () => {
      const num = (id, def) => { const val = parseFloat(String($(id).value).replace(",", ".")); return isNaN(val) ? def : val; };
      const sched = [...state.settings.sched];
      v.querySelectorAll("[data-sched]").forEach(i => { sched[+i.dataset.sched] = toMin(i.value) || 0; });
      state.settings = {
        ...state.settings, sched,
        pauseMin: Math.max(0, Math.round(num("st-pause", 30))),
        winStart: toMin($("st-ws").value) ?? 390, clampStart: $("st-clamp").checked,
        minOut: toMin($("st-minout").value), maxWeek: Math.round(num("st-maxw", 0) * 60),
        holidays: $("st-hol").value, vacDays: num("st-vac", 25), remoteCap: Math.round(num("st-rcap", 0)),
        transit: { home: $("st-home").value.trim(), work: $("st-work").value.trim(), margin: Math.max(0, Math.round(num("st-margin", 5))) }
      };
      trKey = null; saveSettings(); toast("Réglages enregistrés");
    };
    const bkMsg = m => { const el = $("bk-msg"); el.textContent = m; el.hidden = false; };
    $("bk-exp").onclick = () => shareFile("balancier-" + dateKey(new Date()) + ".json", JSON.stringify(state, null, 1), "application/json");
    $("bk-imp").onchange = e => {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        try {
          const data = JSON.parse(rd.result);
          if (!data || typeof data.days !== "object") throw 0;
          let n = 0;
          Object.keys(data.days).forEach(k => { if (/^\d{4}-\d{2}-\d{2}$/.test(k)) { const r = norm(data.days[k]); if (meaningful(r)) { state.days[k] = r; n++; } } });
          if (data.settings) state.settings = migrateSettings(data.settings);
          lsWrite(); renderSettings(); render(); toast(n + " journées importées");
        } catch (err) { bkMsg("Fichier non reconnu. Choisis un fichier exporté depuis Balancier."); }
      };
      rd.readAsText(f);
    };
  }

  // ---------- toast ----------
  let tt;
  function toast(m, undo) {
    const t = $("toast"), u = $("toast-undo");
    $("toast-msg").textContent = m;
    u.hidden = !undo; t.classList.toggle("undo", !!undo);
    u.onclick = undo ? () => { undo(); t.hidden = true; } : null;
    t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, undo ? 5000 : 2000);
  }

  render();
  setInterval(tick, 1000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { trKey = null; render(); } });
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  window.__b = { calc, calcK, holidaysGE, state: () => state, showTab };
})();
</script>
</body>
</html>
