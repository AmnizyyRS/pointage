      <div class="list">
        <div style="padding:12px 0"><div class="seg">${[["auto", "Auto"], ["light", "Clair"], ["dark", "Sombre"]].map(([val, l]) => `<button data-theme="${val}" class="${s.theme === val ? "on" : ""}">${l}</button>`).join("")}</div></div>
        <div class="swatches" style="border-top:1px solid var(--sep)">${Object.keys(ACCENTS).map(k => `<button class="sw${s.accent === k ? " on" : ""}" data-accent="${k}"><i style="background:${ACCENTS[k][mode][0]}"></i>${ACCENTS[k].name}</button>`).join("")}</div>
      </div>
      <div class="sect">Sauvegarde</div>
      <p class="note">Tes pointages sont enregistrés sur ce téléphone. Exporte une copie de temps en temps (dans Fichiers ou iCloud Drive).</p>
      <div class="row"><button class="ghost" id="bk-exp">Exporter</button><button class="ghost" id="bk-imp">Importer</button></div>
      <button class="link" id="st-redo">Refaire la configuration</button>`;
    $("st-prof").onclick = openProfile;
    $("st-work").onclick = () => openWork();
    $("st-redo").onclick = openOnboarding;
    v.querySelectorAll("[data-accent]").forEach(b => b.onclick = () => { state.settings.accent = b.dataset.accent; saveSettings(); renderSettings(); });
    v.querySelectorAll("[data-theme]").forEach(b => b.onclick = () => { state.settings.theme = b.dataset.theme; saveSettings(); renderSettings(); });
    let acT;
    ["st-home", "st-work-addr"].forEach(id => $(id).addEventListener("input", e => {
      clearTimeout(acT); const q = e.target.value.trim(); if (q.length < 3) return;
      acT = setTimeout(async () => {
        try {
          const r = await fetch("https://transport.opendata.ch/v1/locations?type=all&query=" + encodeURIComponent(q));
          const j = await r.json();
          $("dl-stops").innerHTML = (j.stations || []).filter(x => x.name).slice(0, 8).map(x => `<option value="${esc(x.name)}">`).join("");
        } catch (err) {}
      }, 300);
    }));
    $("st-save").onclick = () => {
      const num = (id, def) => { const el = $(id); if (!el) return def; const val = parseFloat(String(el.value).replace(",", ".")); return isNaN(val) ? def : val; };
      Object.assign(state.settings, {
        pauseMin: Math.max(0, Math.round(num("st-pause", 30))), offered: Math.max(0, Math.round(num("st-off", 0))),
        clampStart: $("st-clamp") ? $("st-clamp").checked : s.clampStart,
        maxWeek: $("st-maxw") ? Math.round(num("st-maxw", 0) * 60) : s.maxWeek,
        holidays: $("st-hol").value, vacDays: num("st-vac", 25), remoteCap: Math.round(num("st-rcap", 0)),
        transit: { home: $("st-home").value.trim(), work: $("st-work-addr").value.trim(), margin: Math.max(0, Math.round(num("st-margin", 5))) }
      });
      trKey = null; saveSettings(); renderSettings(); toast("Réglages enregistrés");
    };
    $("bk-exp").onclick = () => shareFile("balancier-" + dateKey(new Date()) + ".json", JSON.stringify(state, null, 1), "application/json");
    $("bk-imp").onclick = () => $("imp-any").click();
  }
  $("imp-any").onchange = e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const data = JSON.parse(rd.result);
        if (!data || typeof data.days !== "object") throw 0;
        let n = 0;
        Object.keys(data.days).forEach(k => { if (/^\d{4}-\d{2}-\d{2}$/.test(k)) { const r = norm(data.days[k]); if (meaningful(r)) { state.days[k] = r; n++; } } });
        if (data.settings) state.settings = migrateSettings(data.settings, true);
        state.settings.onboarded = true;
        lsWrite();
        $("onb").hidden = true; $("onb").innerHTML = "";
        if (tab === "set") renderSettings();
        render(); toast(plural(n, "journée") + " importée" + (n > 1 ? "s" : ""));
      } catch (err) { toast("Fichier non reconnu : choisis un export de Balancier."); }
      e.target.value = "";
    };
    rd.readAsText(f);
  };

  // ---------- toast ----------
  let tt;
  function toast(m, undo) {
    const t = $("toast"), u = $("toast-undo");
    $("toast-msg").textContent = m;
    u.hidden = !undo; t.classList.toggle("undo", !!undo);
    u.onclick = undo ? () => { undo(); t.hidden = true; } : null;
    t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, undo ? 5000 : 2000);
  }

  render();
  if (!state.settings.onboarded) openOnboarding();
  setInterval(tick, 5000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { trKey = null; render(); } });
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  window.__b = { calc, calcK, planFor, activeKey, state: () => state, showTab, openOnboarding };
})();
</script>
</body>
