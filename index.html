<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Balancier.">
<meta name="theme-color" content="#F5F5F7" id="meta-theme">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" href="favicon.png?v=2">
<title>Balancier.</title>
<style>
/* Layout (A1 · compteur façon néobanque): fond gris clair, cartes blanches très arrondies. Aujourd'hui = compteur centré + 4 actions rondes + carte « sortie possible » + trajet + activité façon relevé bancaire. Barre d'onglets translucide en bas. */
:root{
  --bg:#F5F5F7; --card:#FFFFFF; --fg:#1D1D1F; --muted:#6E6E73; --faint:#AEAEB2; --hair:#E8E8ED; --sep:#F0F0F2; --grey-soft:#F2F2F7;
  --accent:#0071E3; --accent-soft:#E8F1FC; --accent-ink:#0058B0; --on-accent:#FFFFFF;
  --ok:#1A7F37; --ok-soft:#E3F3E7; --neg:#C9341F; --neg-soft:#FDECEA; --warn:#B25000; --warn-soft:#FFF1E0; --violet:#3A33A3; --violet-soft:#EEEDFB;
  --scrim:rgba(0,0,0,.28); --bar-bg:rgba(255,255,255,.9);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --tabh:54px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --fg:#F5F5F7; --muted:#98989D; --faint:#636366; --hair:#38383A; --sep:#2C2C2E; --grey-soft:#2C2C2E;
  --accent:#0A84FF; --accent-soft:rgba(10,132,255,.18); --accent-ink:#64B0FF; --on-accent:#FFFFFF;
  --ok:#30D158; --ok-soft:rgba(48,209,88,.16); --neg:#FF453A; --neg-soft:rgba(255,69,58,.16); --warn:#FF9F0A; --warn-soft:rgba(255,159,10,.16); --violet:#A5A1FF; --violet-soft:rgba(125,122,255,.2);
  --scrim:rgba(0,0,0,.6); --bar-bg:rgba(22,22,24,.9);
  color-scheme:dark;
}
html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{min-height:100%;background:var(--bg);color:var(--fg);overscroll-behavior:none}
body{margin:0;font-family:var(--f);font-size:16px;line-height:1.35;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--ok)!important} .neg{color:var(--neg)!important}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{max-width:440px;margin:0 auto;padding-top:12px;padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 20px);display:flex;flex-direction:column}
.view{display:flex;flex-direction:column;gap:12px}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;margin-bottom:4px}
.hello{display:flex;align-items:center;gap:10px;min-width:0}
.hello .t{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.hello small{font-size:12px;color:var(--muted)}
.hello b{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptitle{margin:0;font-size:30px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
/* logo « B. » : les points s'animent quand on est en poste */
.ava{width:40px;height:40px;border-radius:11px;background:var(--card);overflow:hidden;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.mark{display:block;width:40px;height:40px}
.mark .b{fill:var(--fg)}
.mark circle{fill:var(--accent)}
.mark .d1{fill-opacity:.28} .mark .d2{fill-opacity:.55}
.mark.on .d1,.mark.on .d2,.mark.on .d3{animation:blink 1.8s ease-in-out infinite}
.mark.on .d2{animation-delay:.2s} .mark.on .d3{animation-delay:.4s}
@keyframes blink{0%,100%{fill-opacity:var(--o,1)}35%{fill-opacity:.15}}
.mark .d1{--o:.28} .mark .d2{--o:.55}
.status{height:30px;padding:0 12px;border-radius:15px;background:var(--card);display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;white-space:nowrap;flex:none}
.dot{width:8px;height:8px;border-radius:4px;background:var(--faint)}
.dot.on{background:#34C759} .dot.pause{background:#FF9F0A}
.iconbtn{width:36px;height:36px;border:0;border-radius:18px;background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--fg);flex:none}
.iconbtn svg.i{width:18px;height:18px}

/* compteur */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;margin-top:10px}
.hero-k{font-size:13px;font-weight:500;color:var(--muted)}
.hero-v{font-size:clamp(46px,14vw,54px);font-weight:700;letter-spacing:-.045em;line-height:1.08}
.pills{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;justify-content:center}
.pill{height:26px;padding:0 10px;border-radius:13px;border:0;display:flex;align-items:center;font-size:12px;font-weight:600;background:var(--card);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.neg{background:var(--neg-soft);color:var(--neg)}
.spark{display:block;width:100%;max-width:320px;height:34px;margin-top:8px;overflow:visible}
.spark path{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* actions rondes */
.acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:6px 6px 4px}
.act{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--fg)}
.act i{width:56px;height:56px;border-radius:28px;background:var(--card);display:flex;align-items:center;justify-content:center;transition:transform .08s}
.act i svg.i{width:22px;height:22px}
.act.primary{font-weight:600}
.act.primary i{background:var(--accent);color:var(--on-accent)}
.act:active i{transform:scale(.94)}
.act[disabled]{opacity:.35;cursor:default}
.act[disabled]:active i{transform:none}
.act.pop i{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.08)}}

/* cartes */
.card{background:var(--card);border-radius:22px;padding:16px}
.dc-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.dc-top .k{display:block;font-size:13px;color:var(--muted)}
.dc-top b{display:block;font-size:32px;font-weight:700;letter-spacing:-.035em;line-height:1.08}
.dc-top b.word{font-size:26px;letter-spacing:-.025em}
.dc-r{font-size:14px;font-weight:600;color:var(--accent-ink);white-space:nowrap;padding-bottom:4px}
.track{position:relative;height:8px;border-radius:4px;background:var(--hair);margin:14px 0 10px}
.track i{display:block;height:100%;border-radius:4px;background:var(--accent);width:0;transition:width .6s ease}
.track em{position:absolute;top:-4px;left:0;width:16px;height:16px;margin-left:-8px;border-radius:8px;background:var(--card);box-shadow:0 0 0 3px var(--accent);transition:left .6s ease}
.dc-foot{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted)}
.dc-foot span:last-child{text-align:right}
.nudge{margin:12px 0 0;background:var(--grey-soft);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:500}
.nudge.warn{background:var(--warn-soft);color:var(--warn)}
.proj{margin-top:14px;border-top:1px solid var(--sep);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.prow > span:first-child{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prow b{color:var(--fg);font-weight:600}
.prow .big{font-size:20px;font-weight:700;letter-spacing:-.02em}
.prow input{background:var(--grey-soft);border:0;border-radius:8px;padding:3px 8px;font-size:15px;font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums}
.warnline{font-size:13px;color:var(--neg);margin:2px 0 0}

/* listes façon relevé */
.sect{font-size:13px;font-weight:600;color:var(--muted);margin:10px 4px -4px}
.list{background:var(--card);border-radius:22px;padding:0 16px;display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;min-height:52px;border:0;background:none;width:100%;text-align:left;color:inherit}
.item + .item{border-top:1px solid var(--sep)}
.item > span:first-child:not(.ico):not(.dnum){flex:1;min-width:0}
.item small{display:block;color:var(--muted);font-size:13px;margin-top:1px;font-weight:400}
.item input,.item select{background:none;border:0;text-align:right;color:var(--muted);font-size:16px;min-width:0;width:auto;max-width:170px}
.item input[type="text"]{width:100%}
.item input:focus,.item select:focus{outline:none;color:var(--fg)}
.item .grow{flex:1}
.item.future{opacity:.5}
.ico{width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--grey-soft);color:var(--muted)}
.ico svg.i{width:17px;height:17px;stroke-width:2.1}
.ico.blue{background:var(--accent-soft);color:var(--accent-ink)}
.ico.green{background:var(--ok-soft);color:var(--ok)}
.ico.red{background:var(--neg-soft);color:var(--neg)}
.ico.orange{background:var(--warn-soft);color:var(--warn)}
.ico.violet{background:var(--violet-soft);color:var(--violet)}
.ico.big{width:42px;height:42px;border-radius:21px}
.ico.big svg.i{width:20px;height:20px;stroke-width:1.9}
.it-m{flex:1;min-width:0;display:flex;flex-direction:column}
.it-m b{font-size:15px;font-weight:600}
.it-m small{margin-top:0}
.it-r{font-size:15px;font-weight:600;white-space:nowrap}
.it-r.mute{color:var(--muted);font-weight:500}
.chev{color:var(--faint);font-size:22px;line-height:1;flex:none}
.dnum{width:38px;display:flex;flex-direction:column;line-height:1.15;flex:none}
.dnum small{font-size:12px;font-weight:600;color:var(--muted);margin:0}
.dnum b{font-size:16px;font-weight:600}
.rowcard{display:flex;align-items:center;gap:12px;padding:14px 16px;border:0;width:100%;text-align:left;color:inherit}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--bar-bg);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--hair);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar-in{max-width:480px;margin:0 auto;height:var(--tabh);display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#8E8E93;font-size:10.5px;font-weight:500;letter-spacing:0}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent-ink);font-weight:600}
.tab.on svg{stroke-width:2.2}

/* pages */
.big-sum{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;margin-top:4px}
.big-sum b{font-size:clamp(40px,12vw,48px);font-weight:700;letter-spacing:-.045em;line-height:1.1}
.big-sum small{font-size:13px;color:var(--muted)}
.big-sum .unit{font-size:24px;color:var(--muted);letter-spacing:-.02em}
.nav{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:500;color:var(--muted)}
.nav button{border:0;background:none;color:var(--muted);font-size:22px;width:36px;height:32px;border-radius:16px;line-height:1}
.nav button[disabled]{color:var(--hair);cursor:default}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--hair);border-radius:10px;padding:2px}
.seg button{border:0;background:none;color:var(--muted);font-weight:500;font-size:13px;height:30px;border-radius:8px;padding:0 4px}
.seg button.on{background:var(--card);color:var(--fg);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
:root[data-theme="dark"] .seg button.on{background:#636366}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile span{font-size:12px;color:var(--muted)}
.tile b{font-size:19px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.bars-wrap{display:flex;flex-direction:column;gap:8px}
.bars{position:relative;height:120px;display:grid;gap:14px;align-items:end;padding:0 4px}
.bars .tl{position:absolute;left:0;right:0;border-top:1.5px dashed var(--faint);pointer-events:none}
.bars button{border:0;padding:0;border-radius:8px;background:var(--accent);min-height:6px;width:100%}
.bars button.live{opacity:.45}
.bars button.todo{background:var(--sep)}
.bars button.off{background:var(--hair)}
.bars button.miss{background:var(--neg-soft)}
.bar-l{display:grid;gap:14px;padding:0 4px;text-align:center;font-size:12px;color:var(--muted)}
.bar-l b{color:var(--fg);font-weight:700}
.meter{height:8px;border-radius:4px;background:var(--hair);overflow:hidden;width:100%;max-width:300px;margin-top:10px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:4px}
.meter-l{display:flex;justify-content:space-between;width:100%;max-width:300px;font-size:12px;color:var(--muted);margin-top:4px}

/* chart */
.chart{display:flex;flex-direction:column;gap:6px;padding:14px 12px 8px}
.readout{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:0 4px;min-height:44px}
.readout .l{color:var(--muted);font-size:13px;font-weight:500}
.readout .l b{display:block;color:var(--fg);font-size:15px;font-weight:600}
.readout .v{font-size:26px;font-weight:700;letter-spacing:-.02em}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.chart .grid{stroke:var(--sep);stroke-width:1}
.chart .zero{stroke:var(--faint);stroke-width:1;stroke-dasharray:3 3}
.chart .ylab,.chart .xlab{font-size:10px;fill:var(--muted);font-family:var(--f)}
.chart .area{fill:var(--accent);opacity:.1}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--accent);stroke:var(--card);stroke-width:2}
.chart .pt.sel{r:6}
.chart .cross{stroke:var(--faint);stroke-width:1}
.chart .empty{font-size:13px;fill:var(--muted);font-family:var(--f)}

/* boutons */
.note{color:var(--muted);font-size:13px;margin:0 4px}
.err{color:var(--neg);font-size:14px;margin:0 4px}
.row{display:flex;gap:10px}
.row .ghost,.row .cta{flex:1}
.cta{border:0;border-radius:26px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:16px;height:52px;width:100%}
.ghost{border:0;border-radius:26px;background:var(--card);color:var(--fg);font-weight:600;font-size:16px;height:52px;display:flex;align-items:center;justify-content:center;cursor:pointer;width:100%}
.stick{position:sticky;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 12px);z-index:5;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.addp{border:0;background:none;color:var(--accent-ink);font-weight:600;font-size:15px;text-align:left;padding:2px 4px}
.danger{border:0;background:none;color:var(--neg);font-weight:500;font-size:15px;height:44px}
.toggle{accent-color:var(--accent);width:20px;height:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 0}
.chip{border:0;background:var(--grey-soft);color:var(--fg);border-radius:16px;padding:7px 13px;font-size:14px;font-weight:500}
.chip.on{background:var(--accent);color:var(--on-accent)}
.x{border:0;background:var(--grey-soft);color:var(--muted);width:28px;height:28px;border-radius:14px;font-size:16px;line-height:1;flex:none}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px 0}
.sw{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:0}
.sw i{display:block;width:40px;height:40px;border-radius:20px;border:3px solid var(--card);box-shadow:0 0 0 2px transparent}
.sw.on{color:var(--fg);font-weight:600}
.sw.on i{box-shadow:0 0 0 2px var(--fg)}
.lines{display:inline}
.late{color:var(--warn);font-weight:600}

/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:500px;max-height:90%;overflow:auto;border-radius:22px 22px 0 0;
  padding:8px max(16px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
:root[data-theme="dark"] .sheet{background:#1C1C1E;--card:#2C2C2E;--sep:#3A3A3C;--grey-soft:#3A3A3C}
.sheet > *{flex-shrink:0}
.sheet .sect{margin-bottom:-6px}
.grab{width:36px;height:5px;border-radius:3px;background:var(--faint);align-self:center}
.sheet h3{margin:4px 4px 0;font-size:22px;font-weight:700;letter-spacing:-.02em}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);font-size:14px;font-weight:500;padding:6px 6px 6px 16px;min-height:40px;border-radius:20px;z-index:30;white-space:nowrap;display:flex;align-items:center;gap:12px;box-shadow:0 8px 28px rgba(0,0,0,.18)}
.toast button{border:0;background:rgba(128,128,128,.28);color:var(--bg);font-weight:600;font-size:14px;border-radius:14px;padding:6px 12px}
.toast:not(.undo){padding-right:16px}
/* profil & accueil */
.onb{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.onb-in{max-width:440px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.steps{display:flex;gap:6px;justify-content:center;padding:4px 0}
.steps i{width:6px;height:6px;border-radius:3px;background:var(--hair);transition:width .25s}
.steps i.on{width:20px;background:var(--accent)}
.onb h2{margin:6px 4px 0;font-size:30px;font-weight:700;letter-spacing:-.025em;line-height:1.12}
.lead{margin:-4px 4px 0;color:var(--muted);font-size:15px;line-height:1.4}
.onb-nav{position:sticky;bottom:0;margin-top:auto;display:flex;gap:10px;padding:14px 0 calc(env(safe-area-inset-bottom,0px) + 14px);background:linear-gradient(to bottom,transparent,var(--bg) 26%)}
.onb-nav .ghost{flex:0 0 110px}
.hero-mark{width:96px;height:96px;border-radius:22px;background:#FFFFFF;box-shadow:0 10px 30px rgba(0,0,0,.12);align-self:center;margin:12vh 0 8px;overflow:hidden}
.hero-mark svg{width:96px;height:96px;display:block}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid transparent;border-radius:18px;padding:12px 14px;text-align:left;width:100%;color:inherit}
.choice.on{border-color:var(--accent)}
.choice .it-m small{line-height:1.3}
.radio{width:22px;height:22px;border-radius:11px;border:2px solid var(--hair);flex:none}
.choice.on .radio{border:7px solid var(--accent)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:12px 0}
.days button{border:0;height:38px;border-radius:19px;background:var(--grey-soft);font-weight:600;font-size:14px;color:var(--muted);padding:0}
.days button.on{background:var(--accent);color:var(--on-accent)}
details.more{padding:0}
details.more summary{list-style:none;cursor:pointer;color:var(--accent-ink);font-weight:600;font-size:15px;padding:12px 0}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{border-bottom:1px solid var(--sep)}
.item .tname{flex:1;text-align:left;color:var(--fg);max-width:none}
.item .tshort{max-width:86px}
.item.shrow{flex-wrap:wrap;row-gap:2px}
.item.shrow .tname{flex:1 1 0;font-weight:600;font-size:16px}
.shtimes{flex:1 1 100%;display:flex;align-items:center;gap:8px;color:var(--muted)}
.item .shtimes input{text-align:left;max-width:110px;color:var(--fg)}
.sum-line{display:flex;justify-content:space-between;gap:10px;font-size:15px;padding:11px 0}
.sum-line + .sum-line{border-top:1px solid var(--sep)}
.sum-line span{color:var(--muted)}
.sum-line b{font-weight:600;text-align:right}
.avatar{width:48px;height:48px;border-radius:24px;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;flex:none}
.link{border:0;background:none;color:var(--accent-ink);font-weight:600;font-size:15px;padding:8px;align-self:center}
.unit{font-size:.5em;color:var(--muted);letter-spacing:-.01em;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="hello" id="hello">
      <div class="ava">
        <svg class="mark" id="wheel" viewBox="0 0 100 100" aria-hidden="true">
          <path class="b" fill-rule="evenodd" transform="translate(14.5 28)" d="M0 0H21C31 0 36.5 5 36.5 12C36.5 17 33.5 20.5 29 21.6C35 22.6 39 27 39 33.5C39 40.5 33 44 23 44H0Z M10.5 8H19.5C24 8 26 9.8 26 12.6C26 15.4 24 17.6 19.5 17.6H10.5Z M10.5 25.2H21C26 25.2 28.3 27.4 28.3 30.8C28.3 34.3 26 36.2 21 36.2H10.5Z"/>
          <circle class="d1" cx="60" cy="65.6" r="3"/>
          <circle class="d2" cx="68.5" cy="65.6" r="4.3"/>
          <circle class="d3" cx="79.5" cy="65.6" r="6.4"/>
        </svg>
      </div>
      <div class="t"><small id="date"></small><b id="greet">Balancier.</b></div>
    </div>
    <h1 class="ptitle" id="ptitle" hidden></h1>
    <div id="top-r"></div>
  </header>

  <!-- Aujourd'hui -->
  <main class="view" id="v-today">
    <section class="hero">
      <div class="hero-k" id="hero-k">Ton compteur d'heures</div>
      <div class="hero-v num" id="tot">+0 h 00</div>
      <div class="pills"><span class="pill" id="wk-pill"></span><button class="pill" id="spark-pill">30 jours ›</button></div>
      <svg class="spark" id="spark" viewBox="0 0 300 34" preserveAspectRatio="none" role="img" aria-label="Évolution du compteur sur 30 jours"></svg>
    </section>

    <section class="acts">
      <button class="act primary" id="act-main"><i id="act-main-i"></i><span id="act-main-l">Entrée</span></button>
      <button class="act" id="act-pause"><i id="act-pause-i"></i><span id="act-pause-l">Pause</span></button>
      <button class="act" id="act-abs"><i></i><span>Absence</span></button>
      <button class="act" id="act-fix"><i></i><span>Corriger</span></button>
    </section>

    <section class="card" aria-live="polite">
      <div class="dc-top"><div><span class="k" id="dc-k"></span><b class="num" id="dc-v">--:--</b></div><span class="dc-r num" id="dc-r"></span></div>
      <div class="track" id="dc-track" aria-hidden="true"><i id="fill"></i><em id="knob"></em></div>
      <div class="dc-foot"><span id="dc-fl"></span><span id="dc-fr"></span></div>
      <p class="nudge" id="nudge" hidden></p>
      <div class="proj" id="proj" hidden>
        <div class="prow"><span><span id="proj-txt">Si tu sors à</span><input type="time" id="proj-out" aria-label="Heure de sortie prévue"></span><b class="num big" id="proj-bal"></b></div>
        <div class="prow"><span>Semaine</span><span class="num" id="proj-wk"></span></div>
        <div class="prow"><span>Compteur</span><span class="num" id="proj-tot"></span></div>
        <p class="warnline" id="proj-warn" hidden></p>
      </div>
    </section>

    <button class="card rowcard" id="transit" hidden></button>

    <div class="sect">Activité du jour</div>
    <section class="list" id="activity"></section>
  </main>

  <main class="view" id="v-track" hidden></main>
  <main class="view" id="v-abs" hidden></main>
  <main class="view" id="v-set" hidden></main>
</div>

<nav class="tabbar" aria-label="Navigation">
  <div class="tabbar-in">
    <button class="tab on" data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Aujourd'hui</button>
    <button class="tab" data-tab="track"><svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 3 8-8"/><path d="M3 21h18"/></svg>Suivi</button>
    <button class="tab" data-tab="abs"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Absences</button>
    <button class="tab" data-tab="set"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Réglages</button>
  </div>
</nav>

<div class="onb" id="onb" hidden></div>
<input type="file" id="imp-any" accept="application/json,.json" hidden>
<div class="scrim" id="scrim" hidden></div>
<div class="toast" id="toast" hidden><span id="toast-msg"></span><button id="toast-undo" hidden>Annuler</button></div>

<script>
(() => {
  const LS_KEY = "pointage.v1";
  const clone = o => JSON.parse(JSON.stringify(o));
  const FULL = { GE: 2520, FR: 2100, none: 2400 };   // temps plein par semaine (min) selon la région
  const DEFAULT_SETTINGS = {
    onboarded: false, name: "", lastName: "", company: "",
    type: "variable",                                   // variable | partiel | fixe | equipes | forfait
    sched: [0, 504, 504, 504, 504, 504, 0],             // variable/partiel : durée nette par jour (index = getDay(), 0 = dimanche)
    rate: 100,                                          // partiel : taux d'activité
    fixed: [null, { s: 480, e: 1020 }, { s: 480, e: 1020 }, { s: 480, e: 1020 }, { s: 480, e: 1020 }, { s: 480, e: 1020 }, null],
    shifts: [{ id: "m", name: "Matin", s: 360, e: 840 }, { id: "a", name: "Après-midi", s: 840, e: 1320 }, { id: "n", name: "Nuit", s: 1320, e: 360 }],
    rotation: ["m", "a", "n"], rotAnchor: null,
    days: [false, true, true, true, true, true, false], // équipes / forfait : jours travaillés
    forfaitDays: 218,
    pauseMin: 30, offered: 0, winStart: 390, clampStart: false, minOut: null,
    accent: "bleu", theme: "auto", holidays: "GE",
    vacDays: 25, maxWeek: 2700, remoteCap: 0,
    transit: { home: "", work: "", margin: 5 }
  };
  let state = { settings: clone(DEFAULT_SETTINGS), days: {} };

  // ---------- helpers ----------
  const NB = " ";
  const pad = n => String(n).padStart(2, "0");
  const toMin = s => { if (!s) return null; const [h, m] = s.split(":").map(Number); return h * 60 + m; };
  const clock = m => { m = ((Math.round(m) % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ":" + pad(m % 60); };
  const hhmm = m => pad(Math.floor(m / 60)) + ":" + pad(m % 60);          // sans modulo (nuit : 29:05 = 05:05 le lendemain)
  const hm = m => { m = Math.max(0, Math.round(m)); return Math.floor(m / 60) + NB + "h" + NB + pad(m % 60); };
  const hmShort = m => Math.floor(m / 60) + "h" + pad(m % 60);
  const signed = m => { m = Math.round(m); return (m < 0 ? "−" : "+") + hm(Math.abs(m)); };
  const dateKey = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
  const parseKey = k => { const [y, mo, d] = k.split("-").map(Number); return new Date(y, mo - 1, d); };
  const nowRel = k => Math.floor((Date.now() - parseKey(k).getTime()) / 60000); // minutes écoulées depuis minuit du jour k
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const J = ["dim.", "lun.", "mar.", "mer.", "jeu.", "ven.", "sam."];
  const JC = ["Dim", "Lun", "Mar", "Mer", "Jeu", "Ven", "Sam"];
  const JL = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
  const M = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
  const MOIS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
  const WEEK = [1, 2, 3, 4, 5, 6, 0];                   // ordre d'affichage lun → dim
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const longDate = d => J[d.getDay()] + " " + d.getDate() + " " + M[d.getMonth()];
  const short = d => d.getDate() + " " + M[d.getMonth()];
  const mondayOf = d => { const x = new Date(d); x.setDate(x.getDate() - (x.getDay() + 6) % 7); x.setHours(0, 0, 0, 0); return x; };
  const isoWeek = d => { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day); const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y0) / 864e5 + 1) / 7); };
  const sortTimes = a => a.filter(Boolean).sort((x, y) => toMin(x) - toMin(y));
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmtDays = n => String(Math.round(n * 2) / 2).replace(".", ",");
  const plural = (n, w) => n + " " + w + (Math.abs(n) > 1 ? "s" : "");
  const mins = m => m >= 60 ? hm(m) : Math.max(0, Math.round(m)) + NB + "min";
  const daysTxt = arr => {   // arr[getDay()] → « lun–ven », « lun, mer, ven »
    const on = WEEK.filter(d => arr[d]); if (!on.length) return "aucun jour";
    const idx = on.map(d => WEEK.indexOf(d)), cont = idx.every((v, i) => !i || v === idx[i - 1] + 1);
    const nm = d => J[d].replace(".", "");
    return cont && on.length > 2 ? nm(on[0]) + "–" + nm(on[on.length - 1]) : on.map(nm).join(", ");
  };

  // icônes (traits)
  const IC = {
    in: '<path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M9 8l4 4-4 4M13 12H3"/>',
    out: '<path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"/><path d="M15 16l4-4-4-4M19 12H9"/>',
    go: '<path d="M15 8l4 4-4 4M19 12H6"/>',
    cup: '<path d="M5 9h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5V9z"/><path d="M16 11h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M9 3v3M12 3v3"/>',
    cal: '<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
    pen: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
    tram: '<rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14M8.5 20l-1.5 2M15.5 20l1.5 2"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    moon: '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    loop: '<path d="M4 12a8 8 0 0 1 13.7-5.6L20 9M20 4v5h-5"/><path d="M20 12a8 8 0 0 1-13.7 5.6L4 15M4 20v-5h5"/>',
    flag: '<path d="M5 21V4M5 4h12l-2 4 2 4H5"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    stop: '<rect x="6" y="6" width="12" height="12" rx="2.5"/>',
    share: '<path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/>',
    home: '<path d="M4 11l8-7 8 7"/><path d="M6 9.5V20h12V9.5"/>',
    pie: '<circle cx="12" cy="12" r="9"/><path d="M12 3v9h9"/>',
    grid: '<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 10h16M10 10v10"/>',
    brief: '<rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/>'
  };
  const ic = k => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>`;
  const MARK = `<svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" fill="#FFFFFF"/><path fill="#1D1D1F" fill-rule="evenodd" transform="translate(14.5 28)" d="M0 0H21C31 0 36.5 5 36.5 12C36.5 17 33.5 20.5 29 21.6C35 22.6 39 27 39 33.5C39 40.5 33 44 23 44H0Z M10.5 8H19.5C24 8 26 9.8 26 12.6C26 15.4 24 17.6 19.5 17.6H10.5Z M10.5 25.2H21C26 25.2 28.3 27.4 28.3 30.8C28.3 34.3 26 36.2 21 36.2H10.5Z"/><circle cx="60" cy="65.6" r="3" fill="#0071E3" fill-opacity=".28"/><circle cx="68.5" cy="65.6" r="4.3" fill="#0071E3" fill-opacity=".55"/><circle cx="79.5" cy="65.6" r="6.4" fill="#0071E3"/></svg>`;

  const TYPES = { work: "Travail", conge: "Congé", rtt: "RTT", maladie: "Maladie", recup: "Récupération", ferie: "Férié" };
  const TYPE_ICO = { conge: ["sun", "blue"], rtt: ["sun", "violet"], maladie: ["plus", "red"], recup: ["loop", "green"], ferie: ["flag", ""], work: ["clock", ""] };
  const WORK = {
    variable: { name: "Horaire variable", ico: "clock", desc: "Arrivée libre, un nombre d'heures à faire, un compteur d'heures sup." },
    fixe: { name: "Horaire fixe", ico: "grid", desc: "Les mêmes heures chaque jour, par exemple 8 h – 17 h." },
    partiel: { name: "Temps partiel", ico: "pie", desc: "Un pourcentage d'un temps plein, sur les jours de ton choix." },
    equipes: { name: "Équipes / postes", ico: "loop", desc: "Matin, après-midi, nuit, avec une rotation sur plusieurs semaines." },
    forfait: { name: "Forfait jours", ico: "brief", desc: "Cadre au forfait (France) : on compte tes jours, pas tes heures." }
  };
  const REGIONS = { GE: { name: "Suisse · Genève", desc: "Fériés genevois, 42 h par semaine en général" }, FR: { name: "France", desc: "Fériés français, 35 h par semaine" }, none: { name: "Ailleurs", desc: "Pas de jours fériés automatiques" } };
  const typesFor = () => Object.keys(TYPES).filter(t => t !== "rtt" || state.settings.holidays === "FR" || state.settings.type === "forfait");

  const norm = v => ({
    punches: sortTimes(Array.isArray(v && v.punches) ? v.punches : [v && v.in, v && v.bs, v && v.be, v && v.out]),
    type: (v && TYPES[v.type]) ? v.type : "work",
    half: !!(v && v.half), remote: !!(v && v.remote), pause: !!(v && v.pause), shift: (v && v.shift) || null
  });
  const meaningful = r => r.punches.length || r.type !== "work" || r.remote || r.shift;

  const ACCENTS = {
    bleu:   { name: "Bleu",   light: ["#0071E3", "#E8F1FC", "#0058B0", "#FFFFFF"], dark: ["#0A84FF", "rgba(10,132,255,.18)", "#64B0FF", "#FFFFFF"] },
    noir:   { name: "Noir",   light: ["#1D1D1F", "#ECECEE", "#1D1D1F", "#FFFFFF"], dark: ["#F5F5F7", "rgba(255,255,255,.12)", "#F5F5F7", "#000000"] },
    violet: { name: "Violet", light: ["#5E5CE6", "#EEEDFB", "#3A33A3", "#FFFFFF"], dark: ["#7D7AFF", "rgba(125,122,255,.2)", "#A5A1FF", "#FFFFFF"] },
    vert:   { name: "Vert",   light: ["#1A7F37", "#E3F3E7", "#1A7F37", "#FFFFFF"], dark: ["#30D158", "rgba(48,209,88,.16)", "#30D158", "#000000"] }
  };

  function migrateSettings(s, existingUser) {
    const out = { ...clone(DEFAULT_SETTINGS), ...(s || {}) };
    if (!Array.isArray(out.sched) || out.sched.length !== 7) { const d = (s && s.daily) || 504; out.sched = [0, d, d, d, d, d, 0]; }
    const ot = (s && s.transit) || {};
    out.transit = { home: ot.home || ot.to || "", work: ot.work || ot.from || "", margin: ot.margin ?? ot.walk ?? 5 };
    if (!ACCENTS[out.accent]) out.accent = "bleu";
    if (!WORK[out.type]) out.type = "variable";
    if (s && s.onboarded === undefined && existingUser) out.onboarded = true;   // utilisateurs d'avant les profils
    if (!Array.isArray(out.days) || out.days.length !== 7) out.days = clone(DEFAULT_SETTINGS.days);
    if (!Array.isArray(out.fixed) || out.fixed.length !== 7) out.fixed = clone(DEFAULT_SETTINGS.fixed);
    if (!Array.isArray(out.shifts) || !out.shifts.length) out.shifts = clone(DEFAULT_SETTINGS.shifts);
    if (!Array.isArray(out.rotation) || !out.rotation.length) out.rotation = clone(DEFAULT_SETTINGS.rotation);
    delete out.daily; delete out.winEnd; delete out.tone;
    return out;
  }
  try {
    const c = JSON.parse(localStorage.getItem(LS_KEY) || "null");
    if (c && c.days) {
      const days = {};
      Object.keys(c.days).forEach(k => { const r = norm(c.days[k]); if (meaningful(r)) days[k] = r; });
      state = { settings: migrateSettings(c.settings, true), days };
    }
  } catch (e) {}
  const lsWrite = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} };

  // ---------- thème ----------
  const mq = window.matchMedia ? matchMedia("(prefers-color-scheme: dark)") : null;
  const themeMode = () => { const s = state.settings; return s.theme === "auto" ? (mq && mq.matches ? "dark" : "light") : s.theme; };
  function applyTheme() {
    const mode = themeMode(), root = document.documentElement;
    if (root.dataset.theme !== mode) root.dataset.theme = mode;
    const a = (ACCENTS[state.settings.accent] || ACCENTS.bleu)[mode];
    ["--accent", "--accent-soft", "--accent-ink", "--on-accent"].forEach((v, i) => root.style.setProperty(v, a[i]));
    const mt = document.getElementById("meta-theme"); if (mt) mt.content = mode === "dark" ? "#000000" : "#F5F5F7";
  }
  if (mq && mq.addEventListener) mq.addEventListener("change", () => { render(); if (tab === "set") renderSettings(); });

  // ---------- jours fériés ----------
  const holCache = {};
  function easter(y) {
    const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25),
      g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4,
      l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
      month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
    return new Date(y, month - 1, day);
  }
  function holidaysOf(region, y) {
    const key = region + y; if (holCache[key]) return holCache[key];
    const E = easter(y), H = {};
    const add = (d, n) => { H[dateKey(d)] = n; };
    if (region === "GE") {
      add(new Date(y, 0, 1), "Nouvel An"); add(addDays(E, -2), "Vendredi saint"); add(addDays(E, 1), "Lundi de Pâques");
      add(addDays(E, 39), "Ascension"); add(addDays(E, 50), "Lundi de Pentecôte"); add(new Date(y, 7, 1), "Fête nationale");
      const s1 = new Date(y, 8, 1); while (s1.getDay() !== 0) s1.setDate(s1.getDate() + 1);
      add(addDays(s1, 4), "Jeûne genevois"); add(new Date(y, 11, 25), "Noël"); add(new Date(y, 11, 31), "Restauration de la République");
    } else if (region === "FR") {
      add(new Date(y, 0, 1), "Jour de l'an"); add(addDays(E, 1), "Lundi de Pâques"); add(new Date(y, 4, 1), "Fête du Travail");
      add(new Date(y, 4, 8), "Victoire 1945"); add(addDays(E, 39), "Ascension"); add(addDays(E, 50), "Lundi de Pentecôte");
      add(new Date(y, 6, 14), "Fête nationale"); add(new Date(y, 7, 15), "Assomption"); add(new Date(y, 10, 1), "Toussaint");
      add(new Date(y, 10, 11), "Armistice"); add(new Date(y, 11, 25), "Noël");
    }
    return (holCache[key] = H);
  }
  const holidaysFor = y => holidaysOf(state.settings.holidays, y);
  const holidayName = k => holidaysFor(+k.slice(0, 4))[k] || null;

  // ---------- planning selon le profil ----------
  const isFlex = () => ["variable", "partiel"].includes(state.settings.type);
  const isForfait = () => state.settings.type === "forfait";
  const netOf = amp => Math.max(0, amp - (amp > 330 + state.settings.pauseMin ? state.settings.pauseMin : 0));
  function shiftFor(k, rec) {
    const s = state.settings, dow = parseKey(k).getDay();
    if (rec && rec.shift) return rec.shift === "off" ? null : s.shifts.find(x => x.id === rec.shift) || null;
    if (!s.days[dow] || !s.rotation.length) return null;
    const anchor = s.rotAnchor ? parseKey(s.rotAnchor) : mondayOf(new Date());
    const w = Math.round((mondayOf(parseKey(k)) - anchor) / (7 * 864e5)), L = s.rotation.length;
    const id = s.rotation[((w % L) + L) % L];
    return s.shifts.find(x => x.id === id) || null;
  }
  // plan du jour : durée nette à faire (net), et pour fixe/équipes l'horaire prévu (start/end en minutes, end > 1440 si la nuit passe minuit)
  function planFor(k, rec) {
    const s = state.settings, dow = parseKey(k).getDay();
    if (rec === undefined) rec = state.days[k];
    if (s.type === "fixe") { const f = s.fixed[dow]; if (!f) return { net: 0 }; const e = f.e > f.s ? f.e : f.e + 1440; return { start: f.s, end: e, net: netOf(e - f.s) }; }
    if (s.type === "equipes") { const sh = shiftFor(k, rec); if (!sh) return { net: 0, shift: null }; const e = sh.e > sh.s ? sh.e : sh.e + 1440; return { start: sh.s, end: e, net: netOf(e - sh.s), shift: sh }; }
    if (s.type === "forfait") return { net: s.days[dow] ? 1 : 0 };
    return { net: s.sched[dow] || 0 };
  }
  const baseFor = k => planFor(k).net;
  function targetFor(k, rec) {
    if (isForfait()) return 0;
    const base = planFor(k, rec || null).net;
    const type = rec ? rec.type : "work";
    if (type === "ferie" || (holidayName(k) && type === "work")) return 0;
    if (type === "conge" || type === "maladie" || type === "rtt") return rec.half ? Math.round(base / 2) : 0;
    return base;
  }
  // jour « actif » : hier si un poste de nuit est encore ouvert, sinon aujourd'hui
  function activeKey() {
    const now = new Date(), tk = dateKey(now), yk = dateKey(addDays(now, -1)), r = state.days[yk];
    if (state.days[tk] && state.days[tk].punches.length) return tk;
    if (r && (r.punches.length % 2 === 1 || r.pause)) { const p = planFor(yk); if (p.end > 1440 && nowRel(yk) < p.end + 360) return yk; }
    return tk;
  }

  // ---------- calcul ----------
  function calc(rec, live, k) {
    const s = state.settings, n = nowRel(k);
    if (!rec) return null;
    const t = targetFor(k, rec);
    const p = (rec.punches || []).map(toMin);
    if (!p.length) {
      if (rec.type === "work") return null;
      return { inside: false, raw: 0, gaps: 0, lunch: 0, offered: 0, pauseDue: 0, net: 0, remaining: t, daily: t, first: null, last: null, target: null, complete: true, balance: -t, absence: true };
    }
    if (s.clampStart && isFlex()) p[0] = Math.max(p[0], s.winStart);
    let raw = 0, gaps = 0; const gapList = [];
    for (let i = 0; i < p.length; i += 2) {
      const a = p[i], b = i + 1 < p.length ? p[i + 1] : (live ? n : null);
      if (b != null) raw += Math.max(0, b - a);
      if (i > 0) { const g = Math.max(0, p[i] - p[i - 1]); gaps += g; gapList.push(g); }
    }
    const inside = p.length % 2 === 1;
    const paused = !inside && live && !!rec.pause;
    const needsPause = t > 330 || raw > 330;
    // la plus longue pause = pause de midi (non payée, minimum pauseMin) ; les autres sont offertes jusqu'à s.offered min
    const lunch = needsPause && gapList.length ? Math.max(...gapList) : 0;
    const others = gaps - lunch;
    const offered = Math.min(s.offered || 0, others);
    const pauseDue = needsPause ? Math.max(0, s.pauseMin - lunch) : 0;
    const net = Math.max(0, raw + offered - pauseDue);
    const remaining = t + (t > 330 ? Math.max(0, s.pauseMin - lunch) : pauseDue) - raw - offered;
    const complete = !inside && !paused;
    return {
      inside, paused, raw, gaps, lunch, offered, pauseDue, net, remaining, daily: t,
      first: p[0], last: p[p.length - 1],
      target: inside && live ? n + remaining : null,
      complete, balance: complete ? net - t : null
    };
  }
  const calcK = (k, ak) => calc(state.days[k], k === ak, k);
  function totalsOf(keys, ak) {
    let worked = 0, bal = 0, n = 0, target = 0, days = 0;
    keys.forEach(k => { const r = calcK(k, ak); if (r && r.complete) { worked += r.net; bal += r.balance; target += r.daily; n++; if (!r.absence) days++; } });
    return { worked, bal, n, target, days };
  }
  const weekKeys = mon => { const a = []; for (let i = 0; i < 7; i++) a.push(dateKey(addDays(mon, i))); return a; };

  // ---------- persistance ----------
  function saveDay(k, rec) {
    if (rec && meaningful(rec)) state.days[k] = rec; else delete state.days[k];
    lsWrite(); render();
  }
  function saveSettings() { lsWrite(); render(); }

  // ---------- onglets ----------
  const $ = id => document.getElementById(id);
  let tab = "today";
  const TITLES = { track: "Suivi", abs: "Absences", set: "Réglages" };
  function showTab(t) {
    tab = t;
    document.querySelectorAll(".tab").forEach(b => { const on = b.dataset.tab === t; b.classList.toggle("on", on); b.setAttribute("aria-current", on ? "page" : "false"); });
    ["today", "track", "abs", "set"].forEach(v => { $("v-" + v).hidden = v !== t; });
    $("hello").hidden = t !== "today";
    $("ptitle").hidden = t === "today";
    $("ptitle").textContent = TITLES[t] || "";
    $("top-r").innerHTML = "";
    if (t === "set") renderSettings();
    render();
    window.scrollTo(0, 0);
  }
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { if (b.dataset.tab === "track" && tab !== "track") track.anchor = new Date(); showTab(b.dataset.tab); });

  // ---------- rendu ----------
  function render() {
    applyTheme();
    const ak = activeKey(), rec = state.days[ak];
    $("wheel").classList.toggle("on", !!(rec && rec.punches.length % 2 === 1));
    if (tab === "today") renderToday();
    else if (tab === "track") renderTrack();
    else if (tab === "abs") renderAbs();
  }

  function sparkline(tk, ak) {
    const start = addDays(parseKey(tk), -29), daily = new Array(30).fill(0);
    let base = 0, has = false;
    Object.keys(state.days).forEach(k => {
      const r = calcK(k, ak); if (!r || !r.complete) return;
      has = true;
      const i = Math.round((parseKey(k) - start) / 864e5);
      if (i < 0) base += r.balance; else if (i < 30) daily[i] += r.balance;
    });
    if (!has) return null;
    const cum = []; let acc = base; daily.forEach(v => { acc += v; cum.push(acc); });
    const lo = Math.min(...cum), hi = Math.max(...cum), span = Math.max(1, hi - lo);
    const pts = cum.map((v, i) => [2 + i * (296 / 29), hi === lo ? 17 : 30 - (v - lo) / span * 25]);
    return { d: pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" "), end: pts[29], up: cum[29] >= cum[0] };
  }

  let projOut = null, projDay = null;
  function renderToday() {
    const now = new Date(), tk = dateKey(now), s = state.settings, F = isForfait();
    const ak = activeKey(), n = nowRel(ak);
    const rec = state.days[ak] || null;
    const c = calc(rec, true, ak);
    const hol = holidayName(ak);
    const plan = planFor(ak, rec);
    const t0 = targetFor(ak, rec || { type: "work" });
    const planned = F ? plan.net > 0 && !hol : t0 > 0;
    const pun = rec ? rec.punches : [];
    const inside = pun.length % 2 === 1;
    const onPause = !!(c && c.paused);
    const timed = plan.start != null;   // fixe / équipes : horaire prévu

    const mon = mondayOf(now), y = now.getFullYear();
    let wk = 0, tot = 0, any = false, wkNet = 0, wkDays = 0, yDays = 0;
    Object.keys(state.days).forEach(k => {
      const r = state.days[k], d = parseKey(k), inWeek = d >= mon && d < addDays(mon, 7);
      if (F) { if (r.type === "work" && r.punches.length) { if (d.getFullYear() === y) yDays++; if (inWeek) wkDays++; } return; }
      const x = calcK(k, ak); if (!x || !x.complete) return;
      any = true; tot += x.balance;
      if (inWeek) { wk += x.balance; wkNet += x.net; }
    });

    // en-tête
    const name = (s.name || "").trim();
    $("date").textContent = cap(JL[now.getDay()]) + " " + now.getDate() + " " + MOIS[now.getMonth()];
    $("greet").innerHTML = name ? (now.getHours() >= 18 ? "Bonsoir " : "Bonjour ") + esc(name) : 'Balancier<span style="color:var(--accent)">.</span>';
    let st;
    if (c && c.absence) st = `<span class="dot"></span>${TYPES[rec.type]}${rec.half ? " ½" : ""}`;
    else if (inside) st = `<span class="dot on"></span>${plan.shift ? plan.shift.name : "En poste"} · ${hm(c.raw)}`;
    else if (onPause) st = `<span class="dot pause"></span>En pause · ${mins(n - c.last)}`;
    else if (c && c.complete) st = `<span class="dot"></span>Journée terminée`;
    else if (!planned) st = `<span class="dot"></span>${hol ? "Férié" : "Repos"}`;
    else st = `<span class="dot"></span>${plan.shift ? "Poste " + plan.shift.name.toLowerCase() : "Pas encore pointé"}`;
    $("top-r").innerHTML = `<span class="status num">${st}</span>`;

    // compteur
    const wp = $("wk-pill"), svgS = $("spark");
    if (F) {
      $("hero-k").textContent = `Jours travaillés en ${y}`;
      $("tot").innerHTML = `${yDays}<span class="unit"> / ${s.forfaitDays}</span>`;
      wp.textContent = plural(wkDays, "jour") + " cette semaine"; wp.className = "pill";
      $("spark-pill").textContent = `reste ${Math.max(0, s.forfaitDays - yDays)} j ›`;
      svgS.hidden = true;
    } else {
      $("hero-k").textContent = "Ton compteur d'heures";
      $("tot").textContent = signed(tot);
      if (any) { wp.textContent = signed(wk) + " cette semaine"; wp.className = "pill num " + (wk >= 0 ? "ok" : "neg"); }
      else { wp.textContent = "Aucune journée terminée"; wp.className = "pill"; }
      $("spark-pill").textContent = "30 jours ›";
      const sp = sparkline(tk, ak);
      if (sp) { const col = sp.up ? "var(--ok)" : "var(--neg)"; svgS.innerHTML = `<path d="${sp.d}" style="stroke:${col}"/><circle cx="${sp.end[0].toFixed(1)}" cy="${sp.end[1].toFixed(1)}" r="3.5" style="fill:${col}"/>`; svgS.hidden = false; }
      else svgS.hidden = true;
    }

    // actions
    $("act-main-i").innerHTML = ic(inside ? "out" : onPause ? "go" : "in");
    $("act-main-l").textContent = inside ? "Sortie" : onPause ? "Reprise" : "Entrée";
    $("act-pause-i").innerHTML = ic(onPause ? "stop" : "cup");
    $("act-pause-l").textContent = onPause ? "Terminer" : "Pause";
    $("act-pause").disabled = !(inside || onPause);
    $("act-main").dataset.kind = inside ? "out" : "in";

    // carte du jour
    const dk = $("dc-k"), dv = $("dc-v"), dr = $("dc-r"), fl = $("dc-fl"), fr = $("dc-fr");
    dv.className = "num"; dr.innerHTML = ""; fl.textContent = ""; fr.textContent = "";
    let pct = 0, knob = false, showTrack = true;
    const nudge = $("nudge"); nudge.hidden = true; nudge.className = "nudge";
    const setNudge = (txt, warn) => { nudge.textContent = txt; nudge.hidden = false; if (warn) nudge.classList.add("warn"); };
    const pauseTxt = x => x.gaps ? `Pauses ${x.gaps} min${x.offered ? ` · ${x.offered} offertes` : ""}` : (x.daily > 330 ? `Pause de midi à prendre` : "");
    const MO = isFlex() ? s.minOut : null;
    const leaveOf = x => { const blocked = MO != null && MO > x.target && x.daily > 330; return { blocked, leave: blocked ? MO : x.target }; };

    if (!c) {
      if (!planned) {
        dk.textContent = "Aujourd'hui"; dv.textContent = hol || "Repos"; dv.classList.add("word"); showTrack = false;
        fl.textContent = F ? "Jour non travaillé." : "Si tu pointes, tout compte en plus.";
      } else if (F) {
        dk.textContent = "Forfait jours"; dv.textContent = "Journée prévue"; dv.classList.add("word"); showTrack = false;
        fl.textContent = "Pointe ton arrivée : Balancier surveille ton amplitude (13 h max) et ton repos de 11 h.";
      } else if (timed) {
        dk.textContent = plan.shift ? `Poste ${plan.shift.name.toLowerCase()}` : "Horaire prévu";
        dv.textContent = `${clock(plan.start)} – ${clock(plan.end)}`; dv.classList.add("word"); showTrack = false;
        fl.textContent = n < plan.start ? `Début dans ${hm(plan.start - n)}` : `Début prévu à ${clock(plan.start)}`;
        fr.textContent = `${hm(t0)} à faire`;
      } else {
        const pause = t0 > 330 ? s.pauseMin : 0;
        dk.textContent = "Si tu entres maintenant, sortie à";
        dv.textContent = clock(Math.max(n + t0 + pause, MO ?? 0));
        fl.textContent = `${hm(t0)} à faire`; fr.textContent = pause ? `+ ${pause} min de pause de midi` : "";
        if (n < s.winStart) setNudge(`Plage d'arrivée dès ${clock(s.winStart)}.`);
      }
    } else if (c.absence) {
      dk.textContent = rec.half ? "Demi-journée" : "Aujourd'hui";
      dv.textContent = TYPES[rec.type] + (rec.half ? " ½" : ""); dv.classList.add("word"); showTrack = false;
      fl.innerHTML = rec.type === "recup" ? `<b>${signed(c.balance)}</b> sur ton compteur` : (rec.half ? `Reste ${hm(c.daily)} à pointer` : "Journée sans pointage");
    } else if (F) {
      const amp = (c.complete ? c.last : n) - c.first;
      if (c.complete) {
        dk.textContent = `Sorti à ${clock(c.last)} · présence`; dv.textContent = hm(c.net); showTrack = false;
        const back = c.last + 660;
        fl.textContent = `Repos de 11 h : reprise dès ${back >= 1440 ? "demain " : ""}${clock(back)}`; fr.textContent = `amplitude ${hm(amp)}`;
      } else {
        dk.textContent = onPause ? "En pause · présence" : `Présent depuis ${clock(c.first)}`; dv.textContent = hm(c.raw);
        pct = Math.min(100, amp / 780 * 100); knob = true;
        fl.textContent = `Amplitude ${hm(amp)}`; fr.textContent = `13 h max : ${clock(c.first + 780)}`;
        if (amp > 600) setNudge(`Déjà ${hm(amp)} d'amplitude : l'amplitude maximale est de 13 h.`, true);
      }
    } else if (c.inside) {
      const { blocked, leave } = leaveOf(c);
      dk.textContent = blocked ? `Sortie autorisée à` : timed ? "Fin de journée à" : "Sortie possible à";
      dv.textContent = clock(leave);
      if (leave > n) dr.textContent = `dans ${hm(leave - n)}`;
      else if (c.remaining < 0) dr.innerHTML = `<span class="pos">${signed(-c.remaining)}</span>`;
      else dr.textContent = "maintenant";
      pct = Math.min(100, c.raw / Math.max(1, c.raw + Math.max(0, c.remaining)) * 100); knob = true;
      fl.textContent = `Entrée ${clock(c.first)} · ${hm(c.raw)} faites`;
      fr.textContent = blocked && c.remaining > 0 ? `${hm(c.daily)} atteintes à ${clock(c.target)}` : timed ? `Prévu jusqu'à ${clock(plan.end)}` : pauseTxt(c);
      if (c.gaps === 0 && c.raw >= 330 && c.daily > 330) setNudge("Plus de 5 h 30 sans pause : pense à souffler.", true);
      else if (timed && c.first > plan.start + 2 && c.remaining > 0) setNudge(`Arrivée à ${clock(c.first)} : ${mins(c.first - plan.start)} après le début prévu.`);
      else if (c.remaining <= 0 && !blocked) setNudge("Tes heures sont faites. Bonne fin de journée !");
    } else if (onPause) {
      const cv = calc({ ...rec, pause: false, punches: [...rec.punches, hhmm(n)] }, true, ak);
      const { leave } = leaveOf(cv);
      dk.textContent = "Si tu reprends maintenant, sortie à";
      dv.textContent = clock(leave);
      dr.textContent = `pause ${mins(n - c.last)}`;
      pct = Math.min(100, cv.raw / Math.max(1, cv.raw + Math.max(0, cv.remaining)) * 100); knob = true;
      fl.textContent = `Entrée ${clock(c.first)} · ${hm(c.raw)} faites`;
      fr.textContent = `En pause depuis ${clock(c.last)}`;
    } else {
      dk.textContent = `Sorti à ${clock(c.last)} · solde du jour`;
      dv.textContent = signed(c.balance); dv.classList.add(c.balance >= 0 ? "pos" : "neg");
      pct = Math.min(100, c.daily ? c.net / c.daily * 100 : 100);
      fl.textContent = `${hm(c.net)} comptées`;
      fr.textContent = [c.pauseDue > 0 ? `midi ${s.pauseMin} min déduites` : (c.lunch ? `midi ${c.lunch} min` : ""), c.offered ? `${c.offered} min offertes` : ""].filter(Boolean).join(" · ");
    }
    if (!F && s.maxWeek && wkNet > s.maxWeek) setNudge(`${hm(wkNet)} cette semaine : au-dessus de ton maximum de ${hm(s.maxWeek)}.`, true);
    $("dc-track").hidden = !showTrack;
    $("fill").style.width = pct.toFixed(1) + "%";
    $("knob").style.left = pct.toFixed(1) + "%"; $("knob").hidden = !knob;

    // projection
    const sg = m => `<b class="${m >= 0 ? "pos" : "neg"}">${signed(m)}</b>`;
    const proj = $("proj"), inp = $("proj-out");
    proj.hidden = F || !c || (!c.inside && !c.complete) || (c.absence && rec.type !== "recup" && !rec.half);
    let leaveAt = null;
    if (!F && c && c.inside) {
      if (projDay !== ak) { projDay = ak; projOut = null; }
      const auto = leaveOf(c).leave;
      let L = projOut != null ? projOut : auto;
      if (projOut != null && L < c.first) L += 1440;    // nuit : sortie après minuit
      leaveAt = L;
      if (document.activeElement !== inp) inp.value = clock(L);
      $("proj-txt").textContent = "Si tu sors à";
      inp.hidden = false;
      const pb = L - c.target;
      $("proj-bal").className = "num big " + (pb >= 0 ? "pos" : "neg"); $("proj-bal").textContent = signed(pb);
      $("proj-wk").innerHTML = `${signed(wk)} → ${sg(wk + pb)}`;
      $("proj-tot").innerHTML = `${signed(tot)} → ${sg(tot + pb)}`;
      const w = $("proj-warn"), msgs = [];
      if (MO != null && L < MO && c.daily > 330) msgs.push(`Avant ${clock(MO)} : accord de la direction nécessaire.`);
      const wkProj = wkNet + Math.max(0, c.raw + (L - n) - c.pauseDue);
      if (s.maxWeek && wkProj > s.maxWeek) msgs.push(`Semaine projetée à ${hm(wkProj)}, au-dessus de ${hm(s.maxWeek)}.`);
      w.textContent = msgs.join(" "); w.hidden = !msgs.length;
    } else if (!F && c && c.complete) {
      $("proj-txt").textContent = "Ajouté aujourd'hui";
      inp.hidden = true; $("proj-warn").hidden = true;
      $("proj-bal").className = "num big " + (c.balance >= 0 ? "pos" : "neg"); $("proj-bal").textContent = signed(c.balance);
      $("proj-wk").innerHTML = `${signed(wk - c.balance)} → ${sg(wk)}`;
      $("proj-tot").innerHTML = `${signed(tot - c.balance)} → ${sg(tot)}`;
    }

    // trajet
    if (!c && planned) renderTransit("aller", n, plan);
    else if (c && c.inside) renderTransit("retour", F ? n : leaveAt, plan);
    else renderTransit(null);

    renderActivity(ak, rec, c, planned, onPause, plan);
  }
  $("proj-out").addEventListener("change", e => { projOut = toMin(e.target.value); render(); });

  function renderActivity(ak, rec, c, planned, onPause, plan) {
    const s = state.settings, box = $("activity"), pun = rec ? rec.punches : [];
    if (!pun.length) {
      box.innerHTML = `<button class="item" data-edit><span class="ico">${ic("clock")}</span><span class="it-m"><b>Aucun pointage pour l'instant</b><small>${planned ? "Touche Entrée en arrivant au travail." : "Jour non travaillé."}</small></span></button>`;
      return;
    }
    const p = pun.map(toMin), rows = [];
    const ref = onPause ? calc({ ...rec, pause: false, punches: [...pun, hhmm(nowRel(ak))] }, true, ak) : c;
    let lunchIdx = -1;
    if (ref && ref.lunch > 0 && (ref.lunch >= s.pauseMin || (c && c.complete)))
      for (let i = 2; i < p.length; i += 2) if (p[i] - p[i - 1] === ref.lunch) { lunchIdx = i; break; }
    let budget = s.offered || 0;
    for (let i = 0; i < p.length; i++) {
      let ico, col, title, sub;
      if (i === 0) {
        ico = "in"; col = "blue"; title = "Entrée";
        if (plan.start != null) { const d = p[0] - plan.start; sub = d > 2 ? `${mins(d)} après le début prévu (${clock(plan.start)})` : d < -2 ? `${mins(-d)} avant le début prévu` : "À l'heure"; }
        else sub = isFlex() && p[0] < s.winStart ? `Avant la plage d'arrivée (${clock(s.winStart)})` : "Début de journée";
      } else if (i % 2 === 0) {
        const g = p[i] - p[i - 1];
        ico = "go"; col = "blue";
        if (i === lunchIdx) { title = "Reprise après midi"; sub = `Pause de ${g} min · non payée${g < s.pauseMin ? ` · ${s.pauseMin} min déduites` : ""}`; }
        else { const off = Math.min(budget, g); budget -= off; title = "Reprise"; sub = off >= g ? `Pause de ${g} min · offerte` : off > 0 ? `Pause de ${g} min · ${off} offertes` : `Pause de ${g} min · non payée`; }
      } else if (i < p.length - 1) { ico = "cup"; col = "green"; title = i + 1 === lunchIdx ? "Pause de midi" : "Pause"; sub = `jusqu'à ${clock(p[i + 1])}`; }
      else if (onPause) { ico = "cup"; col = "orange"; title = "Pause en cours"; sub = `depuis ${mins(nowRel(ak) - p[i])}`; }
      else { ico = "out"; col = ""; title = "Sortie"; sub = c && c.complete ? `Fin de journée · ${hm(c.net)} ${isForfait() ? "de présence" : "comptées"}` : "Fin de journée"; }
      rows.push(`<button class="item" data-edit><span class="ico ${col}">${ic(ico)}</span><span class="it-m"><b>${title}</b><small>${esc(sub)}</small></span><span class="it-r num">${clock(p[i])}${p[i] >= 1440 ? `<small style="display:inline;margin-left:4px">+1</small>` : ""}</span></button>`);
    }

  function chartSVG(pts, slots, xlabels) {

  function exportMonth(y, m) {

  async function shareFile(name, text, type) {

  // ---------- Absences ----------

          while (dateKey(d) < e.k) { const kk = dateKey(d); if (baseFor(kk) && !holidayName(kk)) { gapOk = false; break; } d = addDays(d, 1); }
          if (gapOk && r.type === lr.type && !r.half && !lr.half) { last.keys.push(e.k); return; }

  function openRange(draft) {

        </div>` : `<div class="list">
          <label class="item"><span>Heures par semaine</span><input type="number" inputmode="decimal" step="0.25" min="1" max="70" data-f="weekly" value="${+(d.weekly / 60).toFixed(2)}" style="max-width:70px"></label>
        </div>`}
        ${days}
        <p class="note">${d.type === "partiel" ? `${d.rate} % de ${hm(d.full)} = <b>${hm(d.weekly)}</b> par semaine, ` : ""}soit <b>${hm(perDay)}</b> par jour travaillé.</p>
        <div class="list">
          <label class="item"><span>Arrivée possible dès<small>Début de ta plage d'arrivée</small></span><input type="time" data-f="winStart" value="${clock(d.winStart)}"></label>
          <label class="item"><span>Sortie au plus tôt<small>Facultatif : avant, accord nécessaire</small></span><input type="time" data-f="minOut" value="${d.minOut != null ? clock(d.minOut) : ""}"></label>
        </div>
        <div class="list"><details class="more"><summary>Ajuster jour par jour</summary>${WEEK.filter(w => d.workdays[w]).map(w => `<label class="item"><span>${cap(JL[w])}</span><input type="time" data-sched="${w}" value="${clock(d.sched[w] || 0)}"></label>`).join("")}</details></div>`;
    }
    if (d.type === "fixe") {
      return `${days}
        <div class="list">
          <label class="item"><span>Début</span><input type="time" data-f="fs" value="${clock(d.fs)}"></label>
          <label class="item"><span>Fin</span><input type="time" data-f="fe" value="${clock(d.fe)}"></label>
        </div>
        <p class="note">Soit <b>${hm(netOf(((d.fe - d.fs) + 1440) % 1440))}</b> de travail par jour, pause de midi déduite.</p>
        <div class="list"><details class="more"><summary>Horaire différent selon les jours</summary>${WEEK.filter(w => d.fixed[w]).map(w => `<div class="item"><span class="grow">${cap(JL[w])}</span><input type="time" class="tshort" data-fx="${w}" data-p="s" value="${clock(d.fixed[w].s)}"><span style="color:var(--muted)">–</span><input type="time" class="tshort" data-fx="${w}" data-p="e" value="${clock(d.fixed[w].e)}"></div>`).join("")}</details></div>`;
    }
    if (d.type === "equipes") {
      const opts = sel => d.shifts.map(x => `<option value="${x.id}" ${sel === x.id ? "selected" : ""}>${esc(x.name)}</option>`).join("") + `<option value="off" ${sel === "off" ? "selected" : ""}>Repos</option>`;
      return `<div class="sect">Tes postes</div>
        <div class="list">${d.shifts.map((x, i) => `<div class="item shrow"><input type="text" class="tname" data-sh="${i}" data-p="name" value="${esc(x.name)}" aria-label="Nom du poste">${d.shifts.length > 1 ? `<button class="x" data-shdel="${i}" aria-label="Supprimer ce poste">×</button>` : ""}<span class="shtimes"><input type="time" data-sh="${i}" data-p="s" value="${clock(x.s)}" aria-label="Début"><span>–</span><input type="time" data-sh="${i}" data-p="e" value="${clock(x.e)}" aria-label="Fin">${(x.e <= x.s) ? `<small style="display:inline;margin:0">+1 j</small>` : ""}</span></div>`).join("")}</div>
        <button class="addp" id="sh-add">+ Ajouter un poste</button>
        ${days}
        <div class="sect">Rotation</div>
        <div class="list">${d.rotation.map((id, i) => `<div class="item"><span class="grow">Semaine ${i + 1}</span><select data-rot="${i}">${opts(id)}</select>${d.rotation.length > 1 ? `<button class="x" data-rotdel="${i}" aria-label="Retirer cette semaine">×</button>` : ""}</div>`).join("")}
          <label class="item"><span>Cette semaine, tu es en<small>Semaine ${isoWeek(new Date())} du calendrier</small></span><select data-f="rotNow">${d.rotation.map((_, i) => `<option value="${i}" ${d.rotNow === i ? "selected" : ""}>Semaine ${i + 1}</option>`).join("")}</select></label>
        </div>
        <button class="addp" id="rot-add">+ Ajouter une semaine au cycle</button>
        <p class="note">Un poste de nuit qui finit après minuit est compté sur le jour où il commence. Tu peux changer le poste d'un jour précis en touchant ce jour.</p>`;
    }
    return `<div class="list"><label class="item"><span>Jours travaillés par an<small>218 pour un forfait plein</small></span><input type="number" inputmode="numeric" min="1" max="235" data-f="forfaitDays" value="${d.forfaitDays}" style="max-width:70px"></label></div>
      ${days}
      <p class="note">Pas de compteur d'heures : Balancier compte tes jours travaillés, surveille ton amplitude (13 h max) et ton repos quotidien de 11 h.</p>`;
  }
  // relie les champs du formulaire au brouillon ; rerender() redessine
  function bindDetails(root, d, rerender) {
    const num = v => { const x = parseFloat(String(v).replace(",", ".")); return isNaN(x) ? null : x; };
    root.querySelectorAll("[data-wtype]").forEach(b => b.onclick = () => {
      const t = b.dataset.wtype; if (t === d.type) return;
      d.type = t;
      if (t === "partiel") { d.weekly = Math.round(d.full * d.rate / 100); spread(d); }
      if (t === "variable") { d.weekly = d.full; spread(d); }
      if (t === "fixe") d.fixed = d.workdays.map(w => w ? { s: d.fs, e: d.fe } : null);
      rerender();
    });
    root.querySelectorAll("[data-dow]").forEach(b => b.onclick = () => {
      const w = +b.dataset.dow; d.workdays[w] = !d.workdays[w];
      if (d.type === "variable" || d.type === "partiel") spread(d);
      if (d.type === "fixe") d.fixed[w] = d.workdays[w] ? { s: d.fs, e: d.fe } : null;
      rerender();
    });
    root.querySelectorAll("[data-f]").forEach(i => i.addEventListener("change", () => {
      const f = i.dataset.f, v = i.value;
      if (f === "weekly") { const h = num(v); if (h) { d.weekly = Math.round(h * 60); d.full = d.weekly; spread(d); } }
      else if (f === "rate") { const r = num(v); if (r) { d.rate = Math.max(5, Math.min(100, Math.round(r))); d.weekly = Math.round(d.full * d.rate / 100); spread(d); } }
      else if (f === "full") { const h = num(v); if (h) { d.full = Math.round(h * 60); d.weekly = Math.round(d.full * d.rate / 100); spread(d); } }
      else if (f === "winStart") d.winStart = toMin(v) ?? d.winStart;
      else if (f === "minOut") d.minOut = toMin(v);
      else if (f === "fs" || f === "fe") { const m = toMin(v); if (m != null) { d[f] = m; d.fixed = d.fixed.map(x => x ? { s: d.fs, e: d.fe } : null); } }
      else if (f === "rotNow") d.rotNow = +v;
      else if (f === "forfaitDays") { const n = num(v); if (n) d.forfaitDays = Math.round(n); }
      else if (f in d) d[f] = v;
      rerender();
    }));
    root.querySelectorAll("[data-sched]").forEach(i => i.addEventListener("change", () => { d.sched[+i.dataset.sched] = toMin(i.value) || 0; d.weekly = d.sched.reduce((a, b) => a + b, 0); rerender(); }));
    root.querySelectorAll("[data-fx]").forEach(i => i.addEventListener("change", () => { const w = +i.dataset.fx, m = toMin(i.value); if (m != null && d.fixed[w]) d.fixed[w][i.dataset.p] = m; rerender(); }));
    root.querySelectorAll("[data-sh]").forEach(i => i.addEventListener("change", () => { const x = d.shifts[+i.dataset.sh]; if (i.dataset.p === "name") x.name = i.value.trim() || x.name; else { const m = toMin(i.value); if (m != null) x[i.dataset.p] = m; } rerender(); }));
    root.querySelectorAll("[data-shdel]").forEach(b => b.onclick = () => { const x = d.shifts.splice(+b.dataset.shdel, 1)[0]; d.rotation = d.rotation.map(id => id === x.id ? "off" : id); rerender(); });
    root.querySelectorAll("[data-rot]").forEach(i => i.addEventListener("change", () => { d.rotation[+i.dataset.rot] = i.value; rerender(); }));
    root.querySelectorAll("[data-rotdel]").forEach(b => b.onclick = () => { d.rotation.splice(+b.dataset.rotdel, 1); d.rotNow = Math.min(d.rotNow, d.rotation.length - 1); rerender(); });
    const sa = root.querySelector("#sh-add"); if (sa) sa.onclick = () => { d.shifts.push({ id: "s" + Date.now().toString(36), name: "Poste " + (d.shifts.length + 1), s: 480, e: 960 }); rerender(); };
    const ra = root.querySelector("#rot-add"); if (ra) ra.onclick = () => { d.rotation.push(d.shifts[d.rotation.length % d.shifts.length].id); rerender(); };
  }
  function checkDraft(d) {
    if (["variable", "partiel", "fixe", "equipes", "forfait"].includes(d.type) && !d.workdays.some(Boolean)) return "Choisis au moins un jour travaillé.";
    if ((d.type === "variable" || d.type === "partiel") && !d.weekly) return "Indique tes heures par semaine.";
    if (d.type === "fixe" && d.fs === d.fe) return "Le début et la fin doivent être différents.";
    if (d.type === "equipes" && !d.rotation.some(id => id !== "off")) return "Ajoute au moins un poste dans la rotation.";
    return null;
  }
  const workSummary = s => {
    const d = draftFrom(s);
    if (s.type === "variable") return `${hm(d.weekly)} par semaine · ${daysTxt(d.workdays)}`;
    if (s.type === "partiel") return `${s.rate} % · ${hm(d.weekly)} par semaine · ${daysTxt(d.workdays)}`;
    if (s.type === "fixe") { const f = s.fixed.find(Boolean); return f ? `${clock(f.s)} – ${clock(f.e)} · ${daysTxt(d.workdays)}` : "Aucun jour"; }
    if (s.type === "equipes") return `${plural(s.shifts.length, "poste")} · rotation sur ${plural(s.rotation.length, "semaine")}`;
    return `${s.forfaitDays} jours par an · ${daysTxt(d.workdays)}`;
  };

  function openWork(draft) {
    const d = draft || draftFrom(state.settings);
    const draw = () => keepScroll(() => {
      openSheet(`<h3>Type d'horaires</h3>${typeChoices(d)}${detailsHTML(d)}
        <p class="err" id="wk-err" hidden></p>
        <div class="row"><button class="ghost" id="wk-cancel">Annuler</button><button class="cta" id="wk-save">Enregistrer</button></div>`);
      const root = sheetEl();
      bindDetails(root, d, draw);
      $("wk-cancel").onclick = closeSheet;
      $("wk-save").onclick = () => { const e = checkDraft(d); if (e) { $("wk-err").textContent = e; $("wk-err").hidden = false; return; } applyDraft(d); closeSheet(); render(); renderSettings(); toast("Horaires enregistrés"); };
    });
    draw();
  }
  function openProfile() {
    const s = state.settings;
    openSheet(`<h3>Ton profil</h3>
      <div class="list">
        <label class="item"><span>Prénom</span><input type="text" id="pf-first" value="${esc(s.name)}" autocomplete="given-name" placeholder="Prénom"></label>

      <p class="note">Tes infos restent sur ton téléphone. Elles servent à personnaliser l'appli et tes exports.</p>

    $("pf-cancel").onclick = closeSheet;
    $("pf-save").onclick = () => { Object.assign(s, { name: $("pf-first").value.trim(), lastName: $("pf-last").value.trim(), company: $("pf-co").value.trim(), holidays: region }); lsWrite(); closeSheet(); render(); renderSettings(); toast("Profil enregistré"); };
  }

  // ---------- accueil (premier lancement) ----------
  function openOnboarding() {
    const d = draftFrom(state.settings);
    if (!state.settings.onboarded) { d.offered = 0; d.minOut = null; }
    let step = 0;
    const STEPS = 6;
    const box = $("onb"); box.hidden = false;
    const go = n => { step = n; draw(); box.scrollTop = 0; };
    function draw() {
      const y = box.scrollTop;
      const dots = `<div class="steps">${Array.from({ length: STEPS }, (_, i) => `<i class="${i === step ? "on" : ""}"></i>`).join("")}</div>`;
      let body = "", next = "Continuer", back = step > 0;
      if (step === 0) {
        body = `<div class="hero-mark">${MARK}</div>
          <h2 style="text-align:center">Bienvenue sur Balancier<span style="color:var(--accent)">.</span></h2>
          <p class="lead" style="text-align:center">Pointe tes heures, suis ton compteur, sache à quelle heure tu peux partir. Le tout réglé sur ton type d'horaires.</p>
          <p class="note" style="text-align:center">Tout reste sur ton téléphone. Pas de compte, pas de pub.</p>`;
        next = "Commencer";
      } else if (step === 1) {
        body = `<h2>Faisons connaissance</h2><p class="lead">Pour te dire bonjour et personnaliser tes exports.</p>
          <div class="list">
            <label class="item"><span>Prénom</span><input type="text" id="ob-first" value="${esc(d.name)}" autocomplete="given-name" placeholder="Prénom"></label>
            <label class="item"><span>Nom</span><input type="text" id="ob-last" value="${esc(d.lastName)}" autocomplete="family-name" placeholder="Facultatif"></label>
            <label class="item"><span>Entreprise</span><input type="text" id="ob-co" value="${esc(d.company)}" autocomplete="organization" placeholder="Facultatif"></label>
          </div><p class="err" id="ob-err" hidden></p>`;
      } else if (step === 2) {
        body = `<h2>Où travailles-tu ?</h2><p class="lead">Pour les jours fériés et la durée légale.</p>
          <div class="choices">${Object.keys(REGIONS).map(r => `<button class="choice${d.region === r ? " on" : ""}" data-region="${r}"><span class="it-m"><b>${REGIONS[r].name}</b><small>${REGIONS[r].desc}</small></span><span class="radio"></span></button>`).join("")}</div>`;
      } else if (step === 3) {
        body = `<h2>Ton type d'horaires</h2><p class="lead">Tu pourras le changer à tout moment dans Réglages.</p>${typeChoices(d)}`;
      } else if (step === 4) {
        body = `<h2>${WORK[d.type].name}</h2><p class="lead">Les détails de ton planning.</p>${detailsHTML(d)}<p class="err" id="ob-err" hidden></p>`;
      } else {
        body = `<h2>Pauses et congés</h2><p class="lead">Pour que ton compteur colle à ton contrat.</p>
          <div class="list">
            <label class="item"><span>Pause de midi minimum (min)<small>Non payée</small></span><input type="number" inputmode="numeric" min="0" max="180" data-p="pauseMin" value="${d.pauseMin}" style="max-width:70px"></label>
            <label class="item"><span>Pauses payées par jour (min)<small>Ex. 20 min offertes : 0 si aucune</small></span><input type="number" inputmode="numeric" min="0" max="120" data-p="offered" value="${d.offered}" style="max-width:70px"></label>
            <label class="item"><span>Jours de congé par an</span><input type="number" inputmode="decimal" step="0.5" min="0" max="60" data-p="vacDays" value="${d.vacDays}" style="max-width:70px"></label>
            ${d.type !== "forfait" ? `<label class="item"><span>Maximum par semaine (h)<small>Pour être prévenu</small></span><input type="number" inputmode="decimal" step="0.5" min="0" max="80" data-p="maxWeek" value="${d.maxWeek ? d.maxWeek / 60 : ""}" style="max-width:70px"></label>` : ""}
          </div>
          <div class="card" style="padding:4px 16px">
            <div class="sum-line"><span>Profil</span><b>${esc([d.name, d.lastName].filter(Boolean).join(" ") || "—")}</b></div>
            <div class="sum-line"><span>Horaires</span><b>${WORK[d.type].name}</b></div>
            <div class="sum-line"><span>Fériés</span><b>${REGIONS[d.region].name}</b></div>
          </div>`;
        next = "C'est parti";
      }
      box.innerHTML = `<div class="onb-in">${dots}${body}
        ${step === 0 ? `<button class="link" id="ob-import">J'ai déjà une sauvegarde</button>` : ""}
        <div class="onb-nav">${back ? `<button class="ghost" id="ob-back">Retour</button>` : ""}<button class="cta" id="ob-next">${next}</button></div></div>`;
      box.scrollTop = y;
      const keepIdentity = () => { if ($("ob-first")) { d.name = $("ob-first").value; d.lastName = $("ob-last").value; d.company = $("ob-co").value; } };
      box.querySelectorAll("[data-region]").forEach(b => b.onclick = () => {
        d.region = b.dataset.region; d.full = FULL[d.region]; d.weekly = d.full; spread(d);
        if (d.region === "FR") { d.maxWeek = 2880; }
        draw();
      });
      if (step === 3 || step === 4) bindDetails(box, d, draw);
      box.querySelectorAll("[data-p]").forEach(i => i.addEventListener("change", () => { const x = parseFloat(String(i.value).replace(",", ".")); const f = i.dataset.p; d[f] = isNaN(x) ? (f === "maxWeek" ? 0 : d[f]) : (f === "maxWeek" ? Math.round(x * 60) : x); }));
      if ($("ob-import")) $("ob-import").onclick = () => $("imp-any").click();
      if ($("ob-back")) $("ob-back").onclick = () => { keepIdentity(); go(step - 1); };
      $("ob-next").onclick = () => {
        const err = m => { const e = $("ob-err"); if (e) { e.textContent = m; e.hidden = false; } };
        if (step === 1) { keepIdentity(); if (!d.name.trim()) return err("Indique au moins ton prénom."); }
        if (step === 4) { const e = checkDraft(d); if (e) return err(e); }
        if (step < STEPS - 1) return go(step + 1);
        box.querySelectorAll("[data-p]").forEach(i => i.dispatchEvent(new Event("change")));
        applyDraft(d); box.hidden = true; box.innerHTML = ""; showTab("today");
        toast(`Bienvenue, ${d.name.trim()} !`);
      };
    }
    draw();
  }
