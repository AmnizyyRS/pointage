<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Balancier.">
<meta name="theme-color" content="#F5F5F7" id="meta-theme">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" href="favicon.png?v=2">
<title>Balancier.</title>
<style>
/* Layout (A1 · compteur façon néobanque): fond gris clair, cartes blanches très arrondies. Aujourd'hui = compteur centré + 4 actions rondes + carte « sortie possible » + trajet + activité façon relevé bancaire. Barre d'onglets translucide en bas. */
:root{
  --bg:#F5F5F7; --card:#FFFFFF; --fg:#1D1D1F; --muted:#6E6E73; --faint:#AEAEB2; --hair:#E8E8ED; --sep:#F0F0F2; --grey-soft:#F2F2F7;
  --accent:#0071E3; --accent-soft:#E8F1FC; --accent-ink:#0058B0; --on-accent:#FFFFFF;
  --ok:#1A7F37; --ok-soft:#E3F3E7; --neg:#C9341F; --neg-soft:#FDECEA; --warn:#B25000; --warn-soft:#FFF1E0; --violet:#3A33A3; --violet-soft:#EEEDFB;
  --scrim:rgba(0,0,0,.28); --bar-bg:rgba(255,255,255,.9);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --tabh:54px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --fg:#F5F5F7; --muted:#98989D; --faint:#636366; --hair:#38383A; --sep:#2C2C2E; --grey-soft:#2C2C2E;
  --accent:#0A84FF; --accent-soft:rgba(10,132,255,.18); --accent-ink:#64B0FF; --on-accent:#FFFFFF;
  --ok:#30D158; --ok-soft:rgba(48,209,88,.16); --neg:#FF453A; --neg-soft:rgba(255,69,58,.16); --warn:#FF9F0A; --warn-soft:rgba(255,159,10,.16); --violet:#A5A1FF; --violet-soft:rgba(125,122,255,.2);
  --scrim:rgba(0,0,0,.6); --bar-bg:rgba(22,22,24,.9);
  color-scheme:dark;
}
html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{min-height:100%;background:var(--bg);color:var(--fg);overscroll-behavior:none}
body{margin:0;font-family:var(--f);font-size:16px;line-height:1.35;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--ok)!important} .neg{color:var(--neg)!important}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{max-width:440px;margin:0 auto;padding-top:12px;padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 20px);display:flex;flex-direction:column}
.view{display:flex;flex-direction:column;gap:12px}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;margin-bottom:4px}
.hello{display:flex;align-items:center;gap:10px;min-width:0}
.hello .t{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.hello small{font-size:12px;color:var(--muted)}
.hello b{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptitle{margin:0;font-size:30px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
/* logo « B. » : les points s'animent quand on est en poste */
.ava{width:40px;height:40px;border-radius:11px;background:var(--card);overflow:hidden;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.mark{display:block;width:40px;height:40px}
.mark .b{fill:var(--fg)}
.mark circle{fill:var(--accent)}
.mark .d1{fill-opacity:.28} .mark .d2{fill-opacity:.55}
.mark.on .d1,.mark.on .d2,.mark.on .d3{animation:blink 1.8s ease-in-out infinite}
.mark.on .d2{animation-delay:.2s} .mark.on .d3{animation-delay:.4s}
@keyframes blink{0%,100%{fill-opacity:var(--o,1)}35%{fill-opacity:.15}}
.mark .d1{--o:.28} .mark .d2{--o:.55}
.status{height:30px;padding:0 12px;border-radius:15px;background:var(--card);display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;white-space:nowrap;flex:none}
.dot{width:8px;height:8px;border-radius:4px;background:var(--faint)}
.dot.on{background:#34C759} .dot.pause{background:#FF9F0A}
.iconbtn{width:36px;height:36px;border:0;border-radius:18px;background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--fg);flex:none}
.iconbtn svg.i{width:18px;height:18px}

/* compteur */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;margin-top:10px}
.hero-k{font-size:13px;font-weight:500;color:var(--muted)}
.hero-v{font-size:clamp(46px,14vw,54px);font-weight:700;letter-spacing:-.045em;line-height:1.08}
.pills{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;justify-content:center}
.pill{height:26px;padding:0 10px;border-radius:13px;border:0;display:flex;align-items:center;font-size:12px;font-weight:600;background:var(--card);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.neg{background:var(--neg-soft);color:var(--neg)}
.spark{display:block;width:100%;max-width:320px;height:34px;margin-top:8px;overflow:visible}
.spark path{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* actions rondes */
.acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:6px 6px 4px}
.act{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--fg)}
.act i{width:56px;height:56px;border-radius:28px;background:var(--card);display:flex;align-items:center;justify-content:center;transition:transform .08s}
.act i svg.i{width:22px;height:22px}
.act.primary{font-weight:600}
.act.primary i{background:var(--accent);color:var(--on-accent)}
.act:active i{transform:scale(.94)}
.act[disabled]{opacity:.35;cursor:default}
.act[disabled]:active i{transform:none}
.act.pop i{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.08)}}

/* cartes */
.card{background:var(--card);border-radius:22px;padding:16px}
.dc-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.dc-top .k{display:block;font-size:13px;color:var(--muted)}
.dc-top b{display:block;font-size:32px;font-weight:700;letter-spacing:-.035em;line-height:1.08}
.dc-top b.word{font-size:26px;letter-spacing:-.025em}
.dc-r{font-size:14px;font-weight:600;color:var(--accent-ink);white-space:nowrap;padding-bottom:4px}
.track{position:relative;height:8px;border-radius:4px;background:var(--hair);margin:14px 0 10px}
.track i{display:block;height:100%;border-radius:4px;background:var(--accent);width:0;transition:width .6s ease}
.track em{position:absolute;top:-4px;left:0;width:16px;height:16px;margin-left:-8px;border-radius:8px;background:var(--card);box-shadow:0 0 0 3px var(--accent);transition:left .6s ease}
.dc-foot{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted)}
.dc-foot span:last-child{text-align:right}
.nudge{margin:12px 0 0;background:var(--grey-soft);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:500}
.nudge.warn{background:var(--warn-soft);color:var(--warn)}
.proj{margin-top:14px;border-top:1px solid var(--sep);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.prow > span:first-child{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prow b{color:var(--fg);font-weight:600}
.prow .big{font-size:20px;font-weight:700;letter-spacing:-.02em}
.prow input{background:var(--grey-soft);border:0;border-radius:8px;padding:3px 8px;font-size:15px;font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums}
.warnline{font-size:13px;color:var(--neg);margin:2px 0 0}

/* listes façon relevé */
.sect{font-size:13px;font-weight:600;color:var(--muted);margin:10px 4px -4px}
.list{background:var(--card);border-radius:22px;padding:0 16px;display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;min-height:52px;border:0;background:none;width:100%;text-align:left;color:inherit}
.item + .item{border-top:1px solid var(--sep)}
.item > span:first-child:not(.ico):not(.dnum){flex:1;min-width:0}
.item small{display:block;color:var(--muted);font-size:13px;margin-top:1px;font-weight:400}
.item input,.item select{background:none;border:0;text-align:right;color:var(--muted);font-size:16px;min-width:0;width:auto;max-width:170px}
.item input[type="text"]{width:100%}
.item input:focus,.item select:focus{outline:none;color:var(--fg)}
.item .grow{flex:1}
.item.future{opacity:.5}
.ico{width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--grey-soft);color:var(--muted)}
.ico svg.i{width:17px;height:17px;stroke-width:2.1}
.ico.blue{background:var(--accent-soft);color:var(--accent-ink)}
.ico.green{background:var(--ok-soft);color:var(--ok)}
.ico.red{background:var(--neg-soft);color:var(--neg)}
.ico.orange{background:var(--warn-soft);color:var(--warn)}
.ico.violet{background:var(--violet-soft);color:var(--violet)}
.ico.big{width:42px;height:42px;border-radius:21px}
.ico.big svg.i{width:20px;height:20px;stroke-width:1.9}
.it-m{flex:1;min-width:0;display:flex;flex-direction:column}
.it-m b{font-size:15px;font-weight:600}
.it-m small{margin-top:0}
.it-r{font-size:15px;font-weight:600;white-space:nowrap}
.it-r.mute{color:var(--muted);font-weight:500}
.chev{color:var(--faint);font-size:22px;line-height:1;flex:none}
.dnum{width:38px;display:flex;flex-direction:column;line-height:1.15;flex:none}
.dnum small{font-size:12px;font-weight:600;color:var(--muted);margin:0}
.dnum b{font-size:16px;font-weight:600}
.rowcard{display:flex;align-items:center;gap:12px;padding:14px 16px;border:0;width:100%;text-align:left;color:inherit}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--bar-bg);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--hair);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar-in{max-width:480px;margin:0 auto;height:var(--tabh);display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#8E8E93;font-size:10.5px;font-weight:500;letter-spacing:0}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent-ink);font-weight:600}
.tab.on svg{stroke-width:2.2}

/* pages */
.big-sum{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;margin-top:4px}
.big-sum b{font-size:clamp(40px,12vw,48px);font-weight:700;letter-spacing:-.045em;line-height:1.1}
.big-sum small{font-size:13px;color:var(--muted)}
.big-sum .unit{font-size:24px;color:var(--muted);letter-spacing:-.02em}
.nav{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:500;color:var(--muted)}
.nav button{border:0;background:none;color:var(--muted);font-size:22px;width:36px;height:32px;border-radius:16px;line-height:1}
.nav button[disabled]{color:var(--hair);cursor:default}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--hair);border-radius:10px;padding:2px}
.seg button{border:0;background:none;color:var(--muted);font-weight:500;font-size:13px;height:30px;border-radius:8px;padding:0 4px}
.seg button.on{background:var(--card);color:var(--fg);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
:root[data-theme="dark"] .seg button.on{background:#636366}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile span{font-size:12px;color:var(--muted)}
.tile b{font-size:19px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.bars-wrap{display:flex;flex-direction:column;gap:8px}
.bars{position:relative;height:120px;display:grid;gap:14px;align-items:end;padding:0 4px}
.bars .tl{position:absolute;left:0;right:0;border-top:1.5px dashed var(--faint);pointer-events:none}
.bars button{border:0;padding:0;border-radius:8px;background:var(--accent);min-height:6px;width:100%}
.bars button.live{opacity:.45}
.bars button.todo{background:var(--sep)}
.bars button.off{background:var(--hair)}
.bars button.miss{background:var(--neg-soft)}
.bar-l{display:grid;gap:14px;padding:0 4px;text-align:center;font-size:12px;color:var(--muted)}
.bar-l b{color:var(--fg);font-weight:700}
.meter{height:8px;border-radius:4px;background:var(--hair);overflow:hidden;width:100%;max-width:300px;margin-top:10px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:4px}
.meter-l{display:flex;justify-content:space-between;width:100%;max-width:300px;font-size:12px;color:var(--muted);margin-top:4px}

/* chart */
.chart{display:flex;flex-direction:column;gap:6px;padding:14px 12px 8px}
.readout{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:0 4px;min-height:44px}
.readout .l{color:var(--muted);font-size:13px;font-weight:500}
.readout .l b{display:block;color:var(--fg);font-size:15px;font-weight:600}
.readout .v{font-size:26px;font-weight:700;letter-spacing:-.02em}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.chart .grid{stroke:var(--sep);stroke-width:1}
.chart .zero{stroke:var(--faint);stroke-width:1;stroke-dasharray:3 3}
.chart .ylab,.chart .xlab{font-size:10px;fill:var(--muted);font-family:var(--f)}
.chart .area{fill:var(--accent);opacity:.1}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--accent);stroke:var(--card);stroke-width:2}
.chart .pt.sel{r:6}
.chart .cross{stroke:var(--faint);stroke-width:1}
.chart .empty{font-size:13px;fill:var(--muted);font-family:var(--f)}

/* boutons */
.note{color:var(--muted);font-size:13px;margin:0 4px}
.err{color:var(--neg);font-size:14px;margin:0 4px}
.row{display:flex;gap:10px}
.row .ghost,.row .cta{flex:1}
.cta{border:0;border-radius:26px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:16px;height:52px;width:100%}
.ghost{border:0;border-radius:26px;background:var(--card);color:var(--fg);font-weight:600;font-size:16px;height:52px;display:flex;align-items:center;justify-content:center;cursor:pointer;width:100%}
.stick{position:sticky;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 12px);z-index:5;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.addp{border:0;background:none;color:var(--accent-ink);font-weight:600;font-size:15px;text-align:left;padding:2px 4px}
.danger{border:0;background:none;color:var(--neg);font-weight:500;font-size:15px;height:44px}
.toggle{accent-color:var(--accent);width:20px;height:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 0}
.chip{border:0;background:var(--grey-soft);color:var(--fg);border-radius:16px;padding:7px 13px;font-size:14px;font-weight:500}
.chip.on{background:var(--accent);color:var(--on-accent)}
.x{border:0;background:var(--grey-soft);color:var(--muted);width:28px;height:28px;border-radius:14px;font-size:16px;line-height:1;flex:none}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px 0}
.sw{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:0}
.sw i{display:block;width:40px;height:40px;border-radius:20px;border:3px solid var(--card);box-shadow:0 0 0 2px transparent}
.sw.on{color:var(--fg);font-weight:600}
.sw.on i{box-shadow:0 0 0 2px var(--fg)}
.lines{display:inline}
.late{color:var(--warn);font-weight:600}

/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:500px;max-height:90%;overflow:auto;border-radius:22px 22px 0 0;
  padding:8px max(16px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
:root[data-theme="dark"] .sheet{background:#1C1C1E;--card:#2C2C2E;--sep:#3A3A3C;--grey-soft:#3A3A3C}
.sheet > *{flex-shrink:0}
.sheet .sect{margin-bottom:-6px}
.grab{width:36px;height:5px;border-radius:3px;background:var(--faint);align-self:center}
.sheet h3{margin:4px 4px 0;font-size:22px;font-weight:700;letter-spacing:-.02em}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);font-size:14px;font-weight:500;padding:6px 6px 6px 16px;min-height:40px;border-radius:20px;z-index:30;white-space:nowrap;display:flex;align-items:center;gap:12px;box-shadow:0 8px 28px rgba(0,0,0,.18)}
.toast button{border:0;background:rgba(128,128,128,.28);color:var(--bg);font-weight:600;font-size:14px;border-radius:14px;padding:6px 12px}
.toast:not(.undo){padding-right:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="hello" id="hello">
      <div class="ava">
        <svg class="mark" id="wheel" viewBox="0 0 100 100" aria-hidden="true">
          <path class="b" fill-rule="evenodd" transform="translate(14.5 28)" d="M0 0H21C31 0 36.5 5 36.5 12C36.5 17 33.5 20.5 29 21.6C35 22.6 39 27 39 33.5C39 40.5 33 44 23 44H0Z M10.5 8H19.5C24 8 26 9.8 26 12.6C26 15.4 24 17.6 19.5 17.6H10.5Z M10.5 25.2H21C26 25.2 28.3 27.4 28.3 30.8C28.3 34.3 26 36.2 21 36.2H10.5Z"/>
          <circle class="d1" cx="60" cy="65.6" r="3"/>
          <circle class="d2" cx="68.5" cy="65.6" r="4.3"/>
          <circle class="d3" cx="79.5" cy="65.6" r="6.4"/>
        </svg>
      </div>
      <div class="t"><small id="date"></small><b id="greet">Balancier.</b></div>
    </div>
    <h1 class="ptitle" id="ptitle" hidden></h1>
    <div id="top-r"></div>
  </header>

  <!-- Aujourd'hui -->
  <main class="view" id="v-today">
    <section class="hero">
      <div class="hero-k">Ton compteur d'heures</div>
      <div class="hero-v num" id="tot">+0 h 00</div>
      <div class="pills"><span class="pill" id="wk-pill"></span><button class="pill" id="spark-pill">30 jours ›</button></div>
      <svg class="spark" id="spark" viewBox="0 0 300 34" preserveAspectRatio="none" role="img" aria-label="Évolution du compteur sur 30 jours"></svg>
    </section>

    <section class="acts">
      <button class="act primary" id="act-main"><i id="act-main-i"></i><span id="act-main-l">Entrée</span></button>
      <button class="act" id="act-pause"><i id="act-pause-i"></i><span id="act-pause-l">Pause</span></button>
      <button class="act" id="act-abs"><i></i><span>Absence</span></button>
      <button class="act" id="act-fix"><i></i><span>Corriger</span></button>
    </section>

    <section class="card" aria-live="polite">
      <div class="dc-top"><div><span class="k" id="dc-k"></span><b class="num" id="dc-v">--:--</b></div><span class="dc-r num" id="dc-r"></span></div>
      <div class="track" id="dc-track" aria-hidden="true"><i id="fill"></i><em id="knob"></em></div>
      <div class="dc-foot"><span id="dc-fl"></span><span id="dc-fr"></span></div>
      <p class="nudge" id="nudge" hidden></p>
      <div class="proj" id="proj" hidden>
        <div class="prow"><span><span id="proj-txt">Si tu sors à</span><input type="time" id="proj-out" aria-label="Heure de sortie prévue"></span><b class="num big" id="proj-bal"></b></div>
        <div class="prow"><span>Semaine</span><span class="num" id="proj-wk"></span></div>
        <div class="prow"><span>Compteur</span><span class="num" id="proj-tot"></span></div>
        <p class="warnline" id="proj-warn" hidden></p>
      </div>
    </section>

    <button class="card rowcard" id="transit" hidden></button>

    <div class="sect">Activité du jour</div>
    <section class="list" id="activity"></section>
  </main>

  <main class="view" id="v-track" hidden></main>
  <main class="view" id="v-abs" hidden></main>
  <main class="view" id="v-set" hidden></main>
</div>

<nav class="tabbar" aria-label="Navigation">
  <div class="tabbar-in">
    <button class="tab on" data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Aujourd'hui</button>
    <button class="tab" data-tab="track"><svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 3 8-8"/><path d="M3 21h18"/></svg>Suivi</button>
    <button class="tab" data-tab="abs"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Absences</button>
    <button class="tab" data-tab="set"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Réglages</button>
  </div>
</nav>

<div class="scrim" id="scrim" hidden></div>
<div class="toast" id="toast" hidden><span id="toast-msg"></span><button id="toast-undo" hidden>Annuler</button></div>

<script>
(() => {
  const LS_KEY = "pointage.v1";
  const clone = o => JSON.parse(JSON.stringify(o));
  const DEFAULT_SETTINGS = {
    sched: [0, 504, 504, 504, 504, 504, 0],   // index = getDay() (0 = dimanche)
    pauseMin: 30, offered: 20, winStart: 390, clampStart: false, minOut: 945,
    accent: "bleu", theme: "auto", holidays: "GE", name: "",
    vacDays: 25, maxWeek: 2700, remoteCap: 0,
    transit: { home: "", work: "", margin: 5 }
  };
  let state = { settings: clone(DEFAULT_SETTINGS), days: {} };

  // ---------- helpers ----------
  const NB = " ";
  const pad = n => String(n).padStart(2, "0");
  const toMin = s => { if (!s) return null; const [h, m] = s.split(":").map(Number); return h * 60 + m; };
  const clock = m => { m = ((Math.round(m) % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ":" + pad(m % 60); };
  const hm = m => { m = Math.max(0, Math.round(m)); return Math.floor(m / 60) + NB + "h" + NB + pad(m % 60); };
  const signed = m => { m = Math.round(m); return (m < 0 ? "−" : "+") + hm(Math.abs(m)); };
  const dateKey = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
  const parseKey = k => { const [y, mo, d] = k.split("-").map(Number); return new Date(y, mo - 1, d); };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const J = ["dim.", "lun.", "mar.", "mer.", "jeu.", "ven.", "sam."];
  const JC = ["Dim", "Lun", "Mar", "Mer", "Jeu", "Ven", "Sam"];
  const JL = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
  const M = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
  const MOIS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const longDate = d => J[d.getDay()] + " " + d.getDate() + " " + M[d.getMonth()];
  const short = d => d.getDate() + " " + M[d.getMonth()];
  const mondayOf = d => { const x = new Date(d); x.setDate(x.getDate() - (x.getDay() + 6) % 7); x.setHours(0, 0, 0, 0); return x; };
  const isoWeek = d => { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day); const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y0) / 864e5 + 1) / 7); };
  const sortTimes = a => a.filter(Boolean).sort((x, y) => toMin(x) - toMin(y));
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmtDays = n => String(Math.round(n * 2) / 2).replace(".", ",");
  const plural = (n, w) => n + " " + w + (Math.abs(n) > 1 ? "s" : "");
  const mins = m => m >= 60 ? hm(m) : Math.max(0, Math.round(m)) + NB + "min";

  // icônes (traits)
  const IC = {
    in: '<path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M9 8l4 4-4 4M13 12H3"/>',
    out: '<path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"/><path d="M15 16l4-4-4-4M19 12H9"/>',
    go: '<path d="M15 8l4 4-4 4M19 12H6"/>',
    cup: '<path d="M5 9h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5V9z"/><path d="M16 11h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M9 3v3M12 3v3"/>',
    cal: '<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
    pen: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
    tram: '<rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14M8.5 20l-1.5 2M15.5 20l1.5 2"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    loop: '<path d="M4 12a8 8 0 0 1 13.7-5.6L20 9M20 4v5h-5"/><path d="M20 12a8 8 0 0 1-13.7 5.6L4 15M4 20v-5h5"/>',
    flag: '<path d="M5 21V4M5 4h12l-2 4 2 4H5"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    stop: '<rect x="6" y="6" width="12" height="12" rx="2.5"/>',
    share: '<path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/>',
    home: '<path d="M4 11l8-7 8 7"/><path d="M6 9.5V20h12V9.5"/>'
  };
  const ic = k => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>`;

  const TYPES = { work: "Travail", conge: "Congé", maladie: "Maladie", recup: "Récupération", ferie: "Férié" };
  const TYPE_ICO = { conge: ["sun", "blue"], maladie: ["plus", "red"], recup: ["loop", "green"], ferie: ["flag", ""], work: ["clock", ""] };
  const norm = v => ({
    punches: sortTimes(Array.isArray(v && v.punches) ? v.punches : [v && v.in, v && v.bs, v && v.be, v && v.out]),
    type: (v && TYPES[v.type]) ? v.type : "work",
    half: !!(v && v.half), remote: !!(v && v.remote), pause: !!(v && v.pause)
  });
  const meaningful = r => r.punches.length || r.type !== "work" || r.remote;

  function migrateSettings(s) {
    const out = { ...clone(DEFAULT_SETTINGS), ...(s || {}) };
    if (!Array.isArray(out.sched) || out.sched.length !== 7) { const d = (s && s.daily) || 504; out.sched = [0, d, d, d, d, d, 0]; }
    const ot = (s && s.transit) || {};
    out.transit = { home: ot.home || ot.to || "", work: ot.work || ot.from || "", margin: ot.margin ?? ot.walk ?? 5 };
    if (!ACCENTS[out.accent]) out.accent = "bleu";
    delete out.daily; delete out.winEnd; delete out.tone;
    return out;
  }

  // ---------- thème & couleur d'accent ----------
  const ACCENTS = {
    bleu:   { name: "Bleu",   light: ["#0071E3", "#E8F1FC", "#0058B0", "#FFFFFF"], dark: ["#0A84FF", "rgba(10,132,255,.18)", "#64B0FF", "#FFFFFF"] },
    noir:   { name: "Noir",   light: ["#1D1D1F", "#ECECEE", "#1D1D1F", "#FFFFFF"], dark: ["#F5F5F7", "rgba(255,255,255,.12)", "#F5F5F7", "#000000"] },
    violet: { name: "Violet", light: ["#5E5CE6", "#EEEDFB", "#3A33A3", "#FFFFFF"], dark: ["#7D7AFF", "rgba(125,122,255,.2)", "#A5A1FF", "#FFFFFF"] },
    vert:   { name: "Vert",   light: ["#1A7F37", "#E3F3E7", "#1A7F37", "#FFFFFF"], dark: ["#30D158", "rgba(48,209,88,.16)", "#30D158", "#000000"] }
  };

  try {
    const c = JSON.parse(localStorage.getItem(LS_KEY) || "null");
    if (c && c.days) {
      const days = {};
      Object.keys(c.days).forEach(k => { const r = norm(c.days[k]); if (meaningful(r)) days[k] = r; });
      state = { settings: migrateSettings(c.settings), days };
    }
  } catch (e) {}
  const lsWrite = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} };

  const mq = window.matchMedia ? matchMedia("(prefers-color-scheme: dark)") : null;
  const themeMode = () => { const s = state.settings; return s.theme === "auto" ? (mq && mq.matches ? "dark" : "light") : s.theme; };
  function applyTheme() {
    const mode = themeMode(), root = document.documentElement;
    if (root.dataset.theme !== mode) root.dataset.theme = mode;
    const a = (ACCENTS[state.settings.accent] || ACCENTS.bleu)[mode];
    ["--accent", "--accent-soft", "--accent-ink", "--on-accent"].forEach((v, i) => root.style.setProperty(v, a[i]));
    const mt = document.getElementById("meta-theme"); if (mt) mt.content = mode === "dark" ? "#000000" : "#F5F5F7";
  }
  if (mq && mq.addEventListener) mq.addEventListener("change", () => { render(); if (tab === "set") renderSettings(); });

  // ---------- jours fériés (Genève) ----------
  const holCache = {};
  function easter(y) {
    const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25),
      g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4,
      l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
      month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
    return new Date(y, month - 1, day);
  }
  function holidaysGE(y) {
    if (holCache[y]) return holCache[y];
    const E = easter(y), H = {};
    const add = (d, n) => { H[dateKey(d)] = n; };
    add(new Date(y, 0, 1), "Nouvel An");
    add(addDays(E, -2), "Vendredi saint");
    add(addDays(E, 1), "Lundi de Pâques");
    add(addDays(E, 39), "Ascension");
    add(addDays(E, 50), "Lundi de Pentecôte");
    add(new Date(y, 7, 1), "Fête nationale");
    const s1 = new Date(y, 8, 1); while (s1.getDay() !== 0) s1.setDate(s1.getDate() + 1);
    add(addDays(s1, 4), "Jeûne genevois");
    add(new Date(y, 11, 25), "Noël");
    add(new Date(y, 11, 31), "Restauration de la République");
    return (holCache[y] = H);
  }
  const holidayName = k => state.settings.holidays === "GE" ? holidaysGE(+k.slice(0, 4))[k] || null : null;

  // ---------- core calc ----------
  function baseFor(k) { return state.settings.sched[parseKey(k).getDay()] || 0; }
  function targetFor(k, rec) {
    const base = baseFor(k);
    const type = rec ? rec.type : "work";
    if (type === "ferie" || (holidayName(k) && type === "work")) return 0;
    if (type === "conge" || type === "maladie") return rec.half ? Math.round(base / 2) : 0;
    return base;
  }
  function calc(rec, isToday, k) {
    const s = state.settings, n = nowMin();
    if (!rec) return null;
    const t = targetFor(k, rec);
    const p = (rec.punches || []).map(toMin);
    if (!p.length) {
      if (rec.type === "work") return null;
      return { inside: false, raw: 0, gaps: 0, lunch: 0, offered: 0, pauseDue: 0, net: 0, remaining: t, daily: t, first: null, last: null, target: null, complete: true, balance: -t, absence: true };
    }
    if (s.clampStart) p[0] = Math.max(p[0], s.winStart);
    let raw = 0, gaps = 0; const gapList = [];
    for (let i = 0; i < p.length; i += 2) {
      const a = p[i], b = i + 1 < p.length ? p[i + 1] : (isToday ? n : null);
      if (b != null) raw += Math.max(0, b - a);
      if (i > 0) { const g = Math.max(0, p[i] - p[i - 1]); gaps += g; gapList.push(g); }
    }
    const inside = p.length % 2 === 1;
    const paused = !inside && isToday && !!rec.pause;   // en pause : la journée n'est pas terminée
    const needsPause = t > 330 || raw > 330;
    // la plus longue pause = pause de midi (non payée, minimum pauseMin) ; les autres pauses sont offertes jusqu'à s.offered min
    const lunch = needsPause && gapList.length ? Math.max(...gapList) : 0;
    const others = gaps - lunch;
    const offered = Math.min(s.offered || 0, others);
    const pauseDue = needsPause ? Math.max(0, s.pauseMin - lunch) : 0;
    const net = Math.max(0, raw + offered - pauseDue);
    const remaining = t + (t > 330 ? Math.max(0, s.pauseMin - lunch) : pauseDue) - raw - offered;
    const complete = !inside && !paused;
    return {
      inside, paused, raw, gaps, lunch, offered, pauseDue, net, remaining, daily: t,
      first: p[0], last: p[p.length - 1],
      target: inside && isToday ? n + remaining : null,
      complete, balance: complete ? net - t : null
    };
  }
  const calcK = (k, tk) => calc(state.days[k], k === tk, k);
  function totalsOf(keys, tk) {
    let worked = 0, bal = 0, n = 0, target = 0;
    keys.forEach(k => { const r = calcK(k, tk); if (r && r.complete) { worked += r.net; bal += r.balance; target += r.daily; n++; } });
    return { worked, bal, n, target };
  }
  const weekKeys = mon => { const a = []; for (let i = 0; i < 7; i++) a.push(dateKey(addDays(mon, i))); return a; };

  // ---------- persistence ----------
  function saveDay(k, rec) {
    if (rec && meaningful(rec)) state.days[k] = rec; else delete state.days[k];
    lsWrite(); render();
  }
  function saveSettings() { lsWrite(); render(); }

  // ---------- tabs ----------
  const $ = id => document.getElementById(id);
  let tab = "today";
  const TITLES = { track: "Suivi", abs: "Absences", set: "Réglages" };
  function showTab(t) {
    tab = t;
    document.querySelectorAll(".tab").forEach(b => { const on = b.dataset.tab === t; b.classList.toggle("on", on); b.setAttribute("aria-current", on ? "page" : "false"); });
    ["today", "track", "abs", "set"].forEach(v => { $("v-" + v).hidden = v !== t; });
    $("hello").hidden = t !== "today";
    $("ptitle").hidden = t === "today";
    $("ptitle").textContent = TITLES[t] || "";
    $("top-r").innerHTML = "";
    if (t === "set") renderSettings();
    render();
    window.scrollTo(0, 0);
  }
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { if (b.dataset.tab === "track" && tab !== "track") track.anchor = new Date(); showTab(b.dataset.tab); });

  // ---------- render ----------
  function render() {
    applyTheme();
    const now = new Date();
    const rec = state.days[dateKey(now)];
    $("wheel").classList.toggle("on", !!(rec && rec.punches.length % 2 === 1));
    if (tab === "today") renderToday();
    else if (tab === "track") renderTrack();
    else if (tab === "abs") renderAbs();
  }

  function sparkline(tk) {
    const start = addDays(parseKey(tk), -29), daily = new Array(30).fill(0);
    let base = 0, has = false;
    Object.keys(state.days).forEach(k => {
      const r = calcK(k, tk); if (!r || !r.complete) return;
      has = true;
      const i = Math.round((parseKey(k) - start) / 864e5);
      if (i < 0) base += r.balance; else if (i < 30) daily[i] += r.balance;
    });
    if (!has) return null;
    const cum = []; let acc = base; daily.forEach(v => { acc += v; cum.push(acc); });
    const lo = Math.min(...cum), hi = Math.max(...cum), span = Math.max(1, hi - lo);
    const pts = cum.map((v, i) => [2 + i * (296 / 29), hi === lo ? 17 : 30 - (v - lo) / span * 25]);
    return { d: pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" "), end: pts[29], up: cum[29] >= cum[0] };
  }

  let projOut = null, projDay = null;
  function renderToday() {
    const now = new Date(), tk = dateKey(now), n = nowMin(), s = state.settings;
    const rec = state.days[tk] || null;
    const c = calc(rec, true, tk);
    const hol = holidayName(tk);
    const t0 = targetFor(tk, rec || { type: "work" });
    const pun = rec ? rec.punches : [];
    const inside = pun.length % 2 === 1;
    const onPause = !!(c && c.paused);

    const mon = mondayOf(now); let wk = 0, tot = 0, any = false, wkNet = 0;
    Object.keys(state.days).forEach(k => {
      const r = calcK(k, tk); if (!r || !r.complete) return;
      any = true; tot += r.balance;
      if (parseKey(k) >= mon && parseKey(k) < addDays(mon, 7)) { wk += r.balance; wkNet += r.net; }
    });

    // en-tête
    const name = (s.name || "").trim();
    $("date").textContent = cap(JL[now.getDay()]) + " " + now.getDate() + " " + MOIS[now.getMonth()];
    $("greet").innerHTML = name ? (now.getHours() >= 18 ? "Bonsoir " : "Bonjour ") + esc(name) : 'Balancier<span style="color:var(--accent)">.</span>';
    let st;
    if (c && c.absence) st = `<span class="dot"></span>${TYPES[rec.type]}${rec.half ? " ½" : ""}`;
    else if (inside) st = `<span class="dot on"></span>En poste · ${hm(c.raw)}`;
    else if (onPause) st = `<span class="dot pause"></span>En pause · ${mins(n - c.last)}`;
    else if (c && c.complete) st = `<span class="dot"></span>Journée terminée`;
    else if (t0 === 0) st = `<span class="dot"></span>${hol ? "Férié" : "Repos"}`;
    else st = `<span class="dot"></span>Pas encore pointé`;
    $("top-r").innerHTML = `<span class="status num">${st}</span>`;

    // compteur
    $("tot").textContent = signed(tot);
    const wp = $("wk-pill");
    if (any) { wp.textContent = signed(wk) + " cette semaine"; wp.className = "pill num " + (wk >= 0 ? "ok" : "neg"); }
    else { wp.textContent = "Aucune journée terminée"; wp.className = "pill"; }
    const sp = sparkline(tk), svgS = $("spark");
    if (sp) { const col = sp.up ? "var(--ok)" : "var(--neg)"; svgS.innerHTML = `<path d="${sp.d}" style="stroke:${col}"/><circle cx="${sp.end[0].toFixed(1)}" cy="${sp.end[1].toFixed(1)}" r="3.5" style="fill:${col}"/>`; svgS.hidden = false; }
    else svgS.hidden = true;

    // actions
    const nextIsIn = !inside;
    const mainL = inside ? "Sortie" : onPause ? "Reprise" : pun.length ? "Entrée" : "Entrée";
    $("act-main-i").innerHTML = ic(inside ? "out" : onPause ? "go" : "in");
    $("act-main-l").textContent = mainL;
    $("act-pause-i").innerHTML = ic(onPause ? "stop" : "cup");
    $("act-pause-l").textContent = onPause ? "Terminer" : "Pause";
    $("act-pause").disabled = !(inside || onPause);
    $("act-main").dataset.kind = nextIsIn ? "in" : "out";

    // carte du jour
    const dk = $("dc-k"), dv = $("dc-v"), dr = $("dc-r"), fl = $("dc-fl"), fr = $("dc-fr");
    dv.className = "num"; dr.innerHTML = ""; fl.textContent = ""; fr.textContent = "";
    let pct = 0, knob = false, showTrack = true;
    const nudge = $("nudge"); nudge.hidden = true; nudge.className = "nudge";
    const setNudge = (txt, warn) => { nudge.textContent = txt; nudge.hidden = false; if (warn) nudge.classList.add("warn"); };
    const pauseTxt = x => x.gaps ? `Pauses ${x.gaps} min${x.offered ? ` · ${x.offered} offertes` : ""}` : (x.daily > 330 ? `Pause de midi à prendre` : "");
    const leaveOf = x => { const blocked = s.minOut != null && s.minOut > x.target && x.daily > 330; return { blocked, leave: blocked ? s.minOut : x.target }; };

    if (!c) {
      if (t0 === 0) {
        dk.textContent = "Aujourd'hui"; dv.textContent = hol || "Repos"; dv.classList.add("word"); showTrack = false;
        fl.textContent = "Si tu pointes, tout compte en plus.";
      } else {
        const pause = t0 > 330 ? s.pauseMin : 0;
        dk.textContent = "Si tu entres maintenant, sortie à";
        dv.textContent = clock(Math.max(n + t0 + pause, s.minOut ?? 0));

  function renderActivity(rec, c, t0, onPause) {

  // ---------- trajets domicile <-> travail (transport.opendata.ch) ----------
  const trCfg = () => { const t = state.settings.transit || {}; return { home: t.home || "", work: t.work || "", margin: t.margin ?? 5 }; };

    const steps = [15, 30, 60, 120, 180, 240, 360, 480, 600, 900, 1200, 1800, 2400];
    const step = steps.find(st => (Math.ceil(hi / st) - Math.floor(lo / st)) <= 4) || 2400;
    lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
    if (hi === lo) hi += step;
    const x = s => CL + (slots <= 1 ? (CW - CL - CR) / 2 : s * (CW - CL - CR) / (slots - 1));
    const y = v => CT + (hi - v) * (CH - CT - CB) / (hi - lo);
    const lab = v => v === 0 ? "0" : (v > 0 ? "+" : "−") + (Math.abs(v) % 60 ? hmShort(Math.abs(v)) : Math.abs(v) / 60 + "h");
    let g = "";
    for (let v = lo; v <= hi + .1; v += step) {
      g += v === 0 ? `<line class="zero" x1="${CL}" x2="${CW - CR}" y1="${y(0)}" y2="${y(0)}"/>` : `<line class="grid" x1="${CL}" x2="${CW - CR}" y1="${y(v)}" y2="${y(v)}"/>`;
      g += `<text class="ylab" x="${CL - 6}" y="${y(v) + 3.5}" text-anchor="end">${lab(v)}</text>`;
    }
    xlabels.forEach(l => { g += `<text class="xlab" x="${x(l.slot)}" y="${CH - 6}" text-anchor="middle">${esc(l.text)}</text>`; });
    const line = pts.map((p, i) => (i ? "L" : "M") + x(p.slot).toFixed(1) + " " + y(p.cum).toFixed(1)).join(" ");
    const area = line + ` L${x(pts[pts.length - 1].slot).toFixed(1)} ${y(0).toFixed(1)} L${x(pts[0].slot).toFixed(1)} ${y(0).toFixed(1)} Z`;
    const dots = pts.map((p, i) => `<circle class="pt" data-i="${i}" cx="${x(p.slot).toFixed(1)}" cy="${y(p.cum).toFixed(1)}" r="${pts.length > 16 ? 3 : 4}"/>`).join("");
    return `<svg viewBox="0 0 ${CW} ${CH}" role="img" aria-label="Évolution du solde cumulé">${g}

      <line class="cross" id="ch-cross" x1="0" x2="0" y1="${CT}" y2="${CH - CB}" visibility="hidden"/>

  }
  function bindChart(root, pts, slots) {
    const svg = root.querySelector("svg"), hit = root.querySelector("#ch-hit");
    const readL = root.querySelector(".readout .l"), readV = root.querySelector(".readout .v");
    const show = i => {
      const p = pts[i]; if (!p) return;
      readL.innerHTML = `<b>${esc(cap(p.label))}</b>Jour ${signed(p.day)} · cumul`;
      readV.textContent = signed(p.cum); readV.className = "v num " + (p.cum >= 0 ? "pos" : "neg");
      root.querySelectorAll(".pt").forEach(c => c.classList.toggle("sel", +c.dataset.i === i));
      const cr = root.querySelector("#ch-cross"), dot = root.querySelector(`.pt[data-i="${i}"]`);
      if (cr && dot) { cr.setAttribute("x1", dot.getAttribute("cx")); cr.setAttribute("x2", dot.getAttribute("cx")); cr.setAttribute("visibility", "visible"); }
    };
    if (!pts.length) { readL.innerHTML = "<b>Solde cumulé</b>Aucune donnée"; readV.textContent = "—"; readV.className = "v num"; return; }
    show(pts.length - 1);
    if (!hit) return;
    const pick = e => {
      const r = svg.getBoundingClientRect(), sx = (e.clientX - r.left) * CW / r.width;

      show(best);
    };

    hit.addEventListener("pointermove", e => { if (e.pointerType === "mouse" || e.buttons) pick(e); });
  }

      isCurrent = y === now.getFullYear() && m === now.getMonth();

      let cum = 0; const ins = [], outs = [], worked = []; let remote = 0;
      keys.forEach(k => {

        const tw = totalsOf(wk, tk);

        mon = addDays(mon, 7);
      }
      html = `<div class="big-sum"><b class="num ${t.n ? (t.bal >= 0 ? "pos" : "neg") : ""}">${t.n ? signed(t.bal) : "—"}</b><small class="num">${hm(t.worked)} comptées · ${plural(keys.length, "jour")} enregistré${keys.length > 1 ? "s" : ""}</small></div>

        <div class="tiles"><div class="tile"><span>Arrivée moy.</span><b class="num">${avgClock(ins)}</b></div><div class="tile"><span>Sortie moy.</span><b class="num">${avgClock(outs)}</b></div><div class="tile"><span>Par jour</span><b class="num">${worked.length ? hm(worked.reduce((a, b) => a + b, 0) / worked.length) : "—"}</b></div></div>

  function exportMonth(y, m) {
    const tk = dateKey(new Date()), lastD = new Date(y, m + 1, 0).getDate();
    const lines = [["Date", "Jour", "Type", "Télétravail", "Pointages", "Travaillé", "Prévu", "Solde"].join(";")];
    let tot = 0;
    const h = v => hmShort(Math.max(0, Math.round(v)));
    const sgn = v => (v < 0 ? "-" : "+") + h(Math.abs(v));
    for (let d = 1; d <= lastD; d++) {
      const k = dateKey(new Date(y, m, d)), r = state.days[k], hol = holidayName(k);

        r ? r.punches.join(" ") : "", c && c.complete ? h(c.net) : "", c ? h(c.daily) : "", c && c.complete ? sgn(c.balance) : ""].join(";"));
    }

  async function shareFile(name, text, type) {

    } catch (e) { if (e && e.name === "AbortError") return false; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();

  // ---------- Absences ----------
  function renderAbs() {
    const now = new Date(), tk = dateKey(now), y = now.getFullYear(), s = state.settings;
    $("top-r").innerHTML = `<span class="status" style="color:var(--muted)">${y}</span>`;
    const yk = Object.keys(state.days).filter(k => k.startsWith(String(y))).sort();
    let vacTaken = 0, vacPlanned = 0, sick = 0, recup = 0, remote = 0;
    yk.forEach(k => {
      const r = state.days[k], amt = r.half ? .5 : 1;
      if (r.type === "conge") { if (k <= tk) vacTaken += amt; else vacPlanned += amt; }
      if (r.type === "maladie") sick += amt;
      if (r.type === "recup") recup += 1;
      if (r.remote) remote++;
    });
    const left = s.vacDays - vacTaken - vacPlanned;

    Object.keys(H).filter(k => k > tk && !(state.days[k] && state.days[k].type !== "work")).sort().slice(0, 3).forEach(k => up.push({ k, kind: "hol" }));

      const out = [];

  function openRange(draft) {
    const today = dateKey(new Date());
    const d = draft || { from: today, to: today, type: "conge", half: false };
    const single = d.from === d.to;
    openSheet(`<h3>Poser une absence</h3>
      <div class="list">
        <label class="item"><span>Du</span><input type="date" id="rg-from" value="${d.from}"></label>
        <label class="item"><span>Au</span><input type="date" id="rg-to" value="${d.to}"></label>
      </div>

        ${single && d.type !== "recup" ? `<label class="item"><span>Demi-journée</span><input type="checkbox" class="toggle" id="rg-half" ${d.half ? "checked" : ""}></label>` : ""}

    const read = () => ({ from: $("rg-from").value, to: $("rg-to").value, type: d.type, half: $("rg-half") ? $("rg-half").checked : false });
    const daysIn = x => { const out = []; if (!x.from || !x.to) return out; let a = parseKey(x.from); const b = parseKey(x.to); while (a <= b && out.length < 370) { const k = dateKey(a); if (baseFor(k) && !holidayName(k)) out.push(k); a = addDays(a, 1); } return out; };
    const info = () => { const x = read(), n = daysIn(x).length; $("rg-info").textContent = n ? `${n === 1 && x.half ? "½ jour ouvré" : plural(n, "jour") + " ouvré" + (n > 1 ? "s" : "")} (week-ends et fériés exclus).` : "Aucun jour ouvré dans cette période."; };
    info();

    }));
    if ($("rg-half")) $("rg-half").addEventListener("change", info);
    scrim.querySelectorAll("[data-type]").forEach(b => b.onclick = () => { const x = read(); x.type = b.dataset.type; if (x.type === "recup") x.half = false; openRange(x); });
    $("rg-cancel").onclick = closeSheet;
    $("rg-save").onclick = () => {
      const x = read(), ks = daysIn(x), err = m => { $("rg-err").textContent = m; $("rg-err").hidden = false; };
      if (x.to < x.from) return err("La date de fin doit être après la date de début.");
      if (!ks.length) return err("Aucun jour ouvré à poser dans cette période.");
      ks.forEach(k => { const ex = state.days[k] || { punches: [], type: "work", half: false, remote: false, pause: false }; state.days[k] = { ...ex, type: x.type, half: ks.length === 1 ? x.half : false }; });
      lsWrite(); closeSheet(); render();
      toast(`${ks.length === 1 && x.half ? "½ jour" : plural(ks.length, "jour")} · ${TYPES[x.type]}`);
    };
  }

  // ---------- Réglages ----------
  function renderSettings() {
    const s = state.settings, D = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi", "Dimanche"], idx = [1, 2, 3, 4, 5, 6, 0];
    const mode = themeMode();
    const v = $("v-set");
    v.innerHTML = `
      <div class="list">
        <label class="item"><span>Ton prénom<small>Pour te dire bonjour</small></span><input type="text" id="st-name" value="${esc(s.name || "")}" placeholder="Facultatif" autocomplete="given-name" style="max-width:150px"></label>
      </div>
      <div class="sect">Apparence</div>
      <div class="list">
        <div style="padding:12px 0"><div class="seg">${[["auto", "Auto"], ["light", "Clair"], ["dark", "Sombre"]].map(([val, l]) => `<button data-theme="${val}" class="${s.theme === val ? "on" : ""}">${l}</button>`).join("")}</div></div>
        <div class="swatches" style="border-top:1px solid var(--sep)">${Object.keys(ACCENTS).map(k => `<button class="sw${s.accent === k ? " on" : ""}" data-accent="${k}"><i style="background:${ACCENTS[k][mode][0]}"></i>${ACCENTS[k].name}</button>`).join("")}</div>
      </div>
      <div class="sect">Horaire de la semaine</div>
      <div class="list">${idx.map((di, i) => `<label class="item"><span>${D[i]}</span><input type="time" data-sched="${di}" value="${s.sched[di] ? clock(s.sched[di]) : ""}"></label>`).join("")}</div>
      <p class="note">Durée à faire chaque jour. Laisse vide pour un jour non travaillé.</p>
      <div class="sect">Règles</div>
      <div class="list">
        <label class="item"><span>Pause offerte par jour (min)<small>Pauses courtes payées : comptées comme du travail</small></span><input type="number" inputmode="numeric" min="0" max="120" id="st-off" value="${s.offered || 0}" style="max-width:70px"></label>
        <label class="item"><span>Pause de midi minimum (min)<small>Non payée, déduite si elle est plus courte</small></span><input type="number" inputmode="numeric" min="0" max="180" id="st-pause" value="${s.pauseMin}" style="max-width:70px"></label>
        <label class="item"><span>Arrivée possible dès</span><input type="time" id="st-ws" value="${clock(s.winStart)}"></label>
        <label class="item"><span>Compter seulement dès cette heure</span><input type="checkbox" class="toggle" id="st-clamp" ${s.clampStart ? "checked" : ""}></label>
        <label class="item"><span>Sortie au plus tôt<small>Vide = pas de limite</small></span><input type="time" id="st-minout" value="${s.minOut != null ? clock(s.minOut) : ""}"></label>
        <label class="item"><span>Maximum par semaine (h)</span><input type="number" inputmode="decimal" min="0" max="80" step="0.5" id="st-maxw" value="${s.maxWeek ? s.maxWeek / 60 : ""}" style="max-width:70px"></label>
      </div>
      <div class="sect">Absences</div>
      <div class="list">
        <label class="item"><span>Jours fériés</span><select id="st-hol"><option value="GE" ${s.holidays === "GE" ? "selected" : ""}>Genève</option><option value="none" ${s.holidays !== "GE" ? "selected" : ""}>Aucun</option></select></label>
        <label class="item"><span>Jours de congé par an</span><input type="number" inputmode="decimal" min="0" max="60" step="0.5" id="st-vac" value="${s.vacDays}" style="max-width:70px"></label>
        <label class="item"><span>Télétravail max par an (j)<small>Vide = pas de plafond</small></span><input type="number" inputmode="numeric" min="0" max="365" id="st-rcap" value="${s.remoteCap || ""}" style="max-width:70px"></label>
      </div>
      <div class="sect">Trajets</div>
      <div class="list">
        <label class="item"><span>Domicile</span><input type="text" id="st-home" list="dl-stops" placeholder="Adresse ou arrêt" value="${esc(s.transit.home)}" autocomplete="off"></label>
        <label class="item"><span>Travail</span><input type="text" id="st-work" list="dl-stops" placeholder="Adresse ou arrêt" value="${esc(s.transit.work)}" autocomplete="off"></label>
        <label class="item"><span>Temps pour quitter le travail (min)<small>Vestiaire, badge, ascenseur…</small></span><input type="number" inputmode="numeric" min="0" max="60" id="st-margin" value="${s.transit.margin}" style="max-width:70px"></label>
      </div>
      <datalist id="dl-stops"></datalist>
      <p class="note">Le matin, Balancier affiche le prochain départ de chez toi. En poste, il te dit quand quitter le travail pour attraper le bon transport. Horaires et retards en temps réel (CFF, TPG, Léman Express…).</p>
      <button class="cta" id="st-save">Enregistrer les réglages</button>
      <div class="sect">Sauvegarde</div>
      <p class="note">Tes pointages sont enregistrés sur cet iPhone. Exporte une copie de temps en temps (dans Fichiers ou iCloud Drive).</p>
      <div class="row"><button class="ghost" id="bk-exp">Exporter</button><label class="ghost">Importer<input type="file" id="bk-imp" accept="application/json,.json" hidden></label></div>
      <p class="note" id="bk-msg" hidden></p>`;
    v.querySelectorAll("[data-accent]").forEach(b => b.onclick = () => { state.settings.accent = b.dataset.accent; saveSettings(); renderSettings(); });
    v.querySelectorAll("[data-theme]").forEach(b => b.onclick = () => { state.settings.theme = b.dataset.theme; saveSettings(); renderSettings(); });
    let acT;
    ["st-home", "st-work"].forEach(id => $(id).addEventListener("input", e => {
      clearTimeout(acT); const q = e.target.value.trim(); if (q.length < 3) return;
      acT = setTimeout(async () => {
        try {
          const r = await fetch("https://transport.opendata.ch/v1/locations?type=all&query=" + encodeURIComponent(q));
          const j = await r.json();
          $("dl-stops").innerHTML = (j.stations || []).filter(x => x.name).slice(0, 8).map(x => `<option value="${esc(x.name)}">`).join("");
        } catch (err) {}
      }, 300);
    }));
    $("st-save").onclick = () => {
      const num = (id, def) => { const val = parseFloat(String($(id).value).replace(",", ".")); return isNaN(val) ? def : val; };
      const sched = [...state.settings.sched];
      v.querySelectorAll("[data-sched]").forEach(i => { sched[+i.dataset.sched] = toMin(i.value) || 0; });
      state.settings = {
        ...state.settings, sched, name: $("st-name").value.trim(),
        pauseMin: Math.max(0, Math.round(num("st-pause", 30))), offered: Math.max(0, Math.round(num("st-off", 0))),
        winStart: toMin($("st-ws").value) ?? 390, clampStart: $("st-clamp").checked,
        minOut: toMin($("st-minout").value), maxWeek: Math.round(num("st-maxw", 0) * 60),
        holidays: $("st-hol").value, vacDays: num("st-vac", 25), remoteCap: Math.round(num("st-rcap", 0)),
        transit: { home: $("st-home").value.trim(), work: $("st-work").value.trim(), margin: Math.max(0, Math.round(num("st-margin", 5))) }
      };
      trKey = null; saveSettings(); toast("Réglages enregistrés");
    };
    $("st-name").addEventListener("change", e => { state.settings.name = e.target.value.trim(); lsWrite(); });
    const bkMsg = m => { const el = $("bk-msg"); el.textContent = m; el.hidden = false; };
    $("bk-exp").onclick = () => shareFile("balancier-" + dateKey(new Date()) + ".json", JSON.stringify(state, null, 1), "application/json");
    $("bk-imp").onchange = e => {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        try {
          const data = JSON.parse(rd.result);
          if (!data || typeof data.days !== "object") throw 0;
          let n = 0;
          Object.keys(data.days).forEach(k => { if (/^\d{4}-\d{2}-\d{2}$/.test(k)) { const r = norm(data.days[k]); if (meaningful(r)) { state.days[k] = r; n++; } } });
          if (data.settings) state.settings = migrateSettings(data.settings);
          lsWrite(); renderSettings(); render(); toast(plural(n, "journée") + " importée" + (n > 1 ? "s" : ""));
        } catch (err) { bkMsg("Fichier non reconnu. Choisis un fichier exporté depuis Balancier."); }
      };
      rd.readAsText(f);
    };
  }

  // ---------- toast ----------
  let tt;
  function toast(m, undo) {
    const t = $("toast"), u = $("toast-undo");
    $("toast-msg").textContent = m;
    u.hidden = !undo; t.classList.toggle("undo", !!undo);
    u.onclick = undo ? () => { undo(); t.hidden = true; } : null;
    t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, undo ? 5000 : 2000);
  }

  render();
  setInterval(tick, 5000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { trKey = null; render(); } });
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  window.__b = { calc, calcK, holidaysGE, state: () => state, showTab };
})();
</script>
</body>
</html>
